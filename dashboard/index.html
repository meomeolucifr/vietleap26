<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rate Cut Lab · Mô phỏng giảm lãi suất cho vay</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
<script>
  // chọn theme trước khi vẽ để không nháy: lựa chọn đã lưu > cài đặt hệ điều hành
  (function () {
    var t = null;
    try { t = localStorage.getItem('rcl-theme'); } catch (e) {}  // bộ nhớ trình duyệt có thể bị chặn khi nhúng trang
    if (!t) t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    document.documentElement.dataset.theme = t;
  })();
</script>
<style>
  :root {
    color-scheme: light;
    --bg: #edf2f8; --card: #ffffff; --card-2: #f5f8fc; --line: #e2e9f2; --line-2: #cfd9e6;
    --ink: #13233a; --ink-2: #536379; --muted: #8494a8;
    --hero: #0f2b4c; --hero-2: #173d69; --hero-ink: #ffffff; --hero-ink-2: #a9c1df;
    --accent: #2a6fdb; --accent-2: #4fc3d9; --accent-soft: #e3eefc;
    --c-bank: #e5484d; --c-dep: #16a9bd; --c-tax: #d98a00;     /* đã kiểm tra bằng validate_palette.js */
    --good: #12a150; --good-soft: #e3f6ea; --warn: #d98a00; --warn-soft: #fdf1dc; --crit: #d03b3b; --crit-soft: #fde8e8;
    --other: #c8d2df; --shadow: 0 1px 2px rgba(19,35,58,.04), 0 8px 24px rgba(19,35,58,.06);
    --r-lg: 22px; --r-md: 14px; --r-sm: 10px;
  }
  [data-theme="dark"] {
    color-scheme: dark;
    --bg: #0a1220; --card: #121d2f; --card-2: #17243a; --line: #1f2d44; --line-2: #2b3c57;
    --ink: #e8eef6; --ink-2: #a7b4c6; --muted: #7a8aa0;
    --hero: #173a63; --hero-2: #1e4a7d; --hero-ink: #ffffff; --hero-ink-2: #b4c8e3;
    --accent: #4b8cf0; --accent-2: #3cc1d4; --accent-soft: #1a2c48;
    --c-bank: #e3585b; --c-dep: #199fb0; --c-tax: #c98500;
    --good: #2fbf6b; --good-soft: #12301f; --warn: #e0a020; --warn-soft: #33270d; --crit: #ef6467; --crit-soft: #3a1618;
    --other: #33445f; --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.25);
  }
  * { box-sizing: border-box; }
  html { background: var(--bg); }
  body { margin: 0; color: var(--ink); background: var(--bg);
         font: 14px/1.55 "Be Vietnam Pro", system-ui, -apple-system, "Segoe UI", sans-serif; }
  button, select, input { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .num { font-variant-numeric: tabular-nums; }
  /* dùng gần hết bề ngang màn hình; chỉ chặn ở màn rất rộng để dòng chữ không quá dài */
  .wrap { max-width: 2200px; margin: 0 auto; padding: 0 clamp(14px, 2vw, 36px) 56px; }

  /* thanh trên cùng */
  .topbar { display: flex; align-items: center; gap: 24px; padding: 18px 0; }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 17px; letter-spacing: -0.01em; }
  .brand svg { width: 28px; height: 28px; }
  .tabs { display: flex; gap: 4px; padding: 4px; background: var(--card); border-radius: 999px; box-shadow: var(--shadow); margin-left: 12px; }
  .tabs button { border: 0; background: none; padding: 7px 16px; border-radius: 999px; color: var(--ink-2); cursor: pointer; font-weight: 500; }
  .tabs button[aria-selected="true"] { background: var(--hero); color: var(--hero-ink); }
  .topbar .spacer { flex: 1; }
  .theme-btn { display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--line-2); background: var(--card);
               border-radius: 999px; padding: 7px 14px; cursor: pointer; color: var(--ink-2); }
  .theme-btn svg { width: 16px; height: 16px; }

  /* đầu trang */
  .pagehead { display: flex; align-items: flex-end; justify-content: space-between; gap: 20px; flex-wrap: wrap; margin: 8px 0 18px; }
  .pagehead h1 { font-size: 28px; line-height: 1.2; margin: 0 0 6px; letter-spacing: -0.02em; font-weight: 700; max-width: 820px; }
  .pagehead p { margin: 0; color: var(--ink-2); max-width: 760px; }
  .pickers { display: flex; gap: 10px; align-items: center; }
  .pill-select { display: flex; align-items: center; gap: 8px; background: var(--card); border: 1px solid var(--line); border-radius: 999px;
                 padding: 4px 6px 4px 14px; box-shadow: var(--shadow); }
  .pill-select label { font-size: 12px; color: var(--muted); }
  .pill-select select { border: 0; background: var(--card-2); border-radius: 999px; padding: 6px 10px; font-weight: 600; cursor: pointer; }

  /* card */
  .card { background: var(--card); border-radius: var(--r-lg); box-shadow: var(--shadow); padding: 20px 22px; min-width: 0; }
  .card h2 { font-size: 16px; margin: 0; font-weight: 600; letter-spacing: -0.01em; }
  .card .desc { color: var(--muted); font-size: 12.5px; margin: 2px 0 0; }
  .card-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; margin-bottom: 12px; }

  /* điều khiển mức giảm */
  .control { display: grid; grid-template-columns: minmax(260px, 1.1fr) 2fr; gap: 28px; align-items: center; margin-bottom: 16px; }
  .bp-big { display: flex; align-items: baseline; gap: 10px; }
  .bp-big input { width: 110px; font-size: 40px; font-weight: 700; letter-spacing: -0.03em; border: 0; border-bottom: 2px solid var(--line-2);
                  background: none; padding: 0 2px; font-variant-numeric: tabular-nums; }
  .bp-big input:focus { border-bottom-color: var(--accent); outline: none; }
  .bp-big .unit { font-size: 18px; font-weight: 600; color: var(--ink-2); }
  .bp-big .eq { color: var(--muted); }
  .control .hint { color: var(--muted); font-size: 12.5px; margin-top: 2px; }
  .slider-row { display: flex; align-items: center; gap: 14px; }
  input[type=range] { flex: 1; accent-color: var(--accent); height: 28px; }
  .chips { display: flex; gap: 6px; }
  .chip { border: 1px solid var(--line-2); background: var(--card); border-radius: 999px; padding: 5px 12px; cursor: pointer; color: var(--ink-2); font-size: 13px; }
  .chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }
  .assump { margin-top: 14px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
  .field { background: var(--card-2); border-radius: var(--r-sm); padding: 9px 12px; }
  .field label { display: block; font-size: 11.5px; color: var(--ink-2); font-weight: 500; line-height: 1.3; min-height: 30px; }
  .field .in { display: flex; align-items: baseline; gap: 4px; }
  .field input { width: 100%; border: 0; background: none; font-size: 17px; font-weight: 600; padding: 2px 0; font-variant-numeric: tabular-nums; }
  .field .u { color: var(--muted); font-size: 12px; }
  .field.hl { background: var(--accent-soft); }

  /* KPI */
  .kpis { display: grid; grid-template-columns: 1.15fr 1fr 1fr 1fr; gap: 16px; }
  .kpi { display: flex; flex-direction: column; }
  .kpi .k-top { display: flex; justify-content: space-between; align-items: center; }
  .kpi .k-label { font-size: 13.5px; font-weight: 600; }
  .kpi .k-value { font-size: 34px; font-weight: 700; letter-spacing: -0.03em; margin: 10px 0 4px; line-height: 1.1; font-variant-numeric: tabular-nums; }
  .kpi .k-value small { font-size: 15px; font-weight: 500; letter-spacing: 0; }
  .kpi .k-sub { font-size: 12.5px; color: var(--ink-2); font-variant-numeric: tabular-nums; }
  .kpi .k-foot { margin-top: auto; padding-top: 12px; }
  .badge { display: inline-flex; align-items: center; gap: 5px; border-radius: 999px; padding: 3px 10px 3px 6px; font-size: 12px; font-weight: 600; }
  .badge i { width: 16px; height: 16px; border-radius: 50%; display: inline-grid; place-items: center; font-style: normal; font-size: 10px; color: #fff; }
  .b-good { background: var(--good-soft); color: var(--good); } .b-good i { background: var(--good); }
  .b-warn { background: var(--warn-soft); color: var(--warn); } .b-warn i { background: var(--warn); }
  .b-crit { background: var(--crit-soft); color: var(--crit); } .b-crit i { background: var(--crit); }
  .b-na { background: var(--card-2); color: var(--muted); } .b-na i { background: var(--muted); }
  .kpi.hero { background: linear-gradient(150deg, var(--hero) 0%, var(--hero-2) 100%); color: var(--hero-ink); }
  .kpi.hero .k-sub { color: var(--hero-ink-2); }
  .kpi.hero .tag { background: rgba(255,255,255,.14); color: #fff; border-radius: 999px; padding: 3px 10px; font-size: 12px; }
  .formula-btn { border: 0; background: none; color: var(--muted); cursor: help; font-size: 12px; padding: 0; text-decoration: underline dotted; }
  .kpi.hero .formula-btn { color: var(--hero-ink-2); }
  .meter { height: 8px; border-radius: 999px; background: var(--card-2); position: relative; margin: 10px 0 6px; overflow: visible; }
  .meter > span { position: absolute; inset: 0 auto 0 0; border-radius: 999px; background: linear-gradient(90deg, var(--accent), var(--accent-2)); }
  .meter > b { position: absolute; top: -4px; width: 2px; height: 16px; background: var(--ink); border-radius: 1px; }
  .meter-legend { display: flex; justify-content: space-between; font-size: 11.5px; color: var(--muted); }

  /* lưới biểu đồ */
  .grid-2 { display: grid; grid-template-columns: 1.45fr 1fr; gap: 16px; margin-top: 16px; }
  .grid-2b { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-top: 16px; }
  .col-stack { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
  .col-stack > .card:last-child { flex: 1; }
  @media (max-width: 1080px) { .kpis { grid-template-columns: 1fr 1fr; } .grid-2, .grid-2b { grid-template-columns: 1fr; }
    .assump { grid-template-columns: repeat(3, 1fr); } .control { grid-template-columns: 1fr; } }
  @media (max-width: 640px) { .kpis { grid-template-columns: 1fr; } .assump { grid-template-columns: 1fr 1fr; } .tabs { display: none; } }
  .chart { position: relative; width: 100%; }
  .chart svg { display: block; width: 100%; height: auto; overflow: visible; }
  svg text { font-family: "Be Vietnam Pro", system-ui, sans-serif; }
  .t-tick { font-size: 11px; fill: var(--muted); font-variant-numeric: tabular-nums; }
  .t-lbl { font-size: 12px; fill: var(--ink-2); font-variant-numeric: tabular-nums; }
  .t-strong { font-size: 12px; fill: var(--ink); font-weight: 600; font-variant-numeric: tabular-nums; }
  .seg { display: inline-flex; background: var(--card-2); border-radius: 999px; padding: 3px; gap: 2px; flex-wrap: wrap; }
  .seg button { border: 0; background: none; border-radius: 999px; padding: 5px 11px; font-size: 12.5px; color: var(--ink-2); cursor: pointer; }
  .seg button[aria-pressed="true"] { background: var(--card); color: var(--ink); font-weight: 600; box-shadow: var(--shadow); }

  /* ai trả */
  .split { display: flex; height: 44px; border-radius: 12px; overflow: hidden; gap: 2px; margin: 14px 0 12px; }
  .split > div { min-width: 2px; }
  .split-legend { display: grid; gap: 10px; }
  .split-legend .it { display: grid; grid-template-columns: 12px 1fr auto auto; gap: 10px; align-items: center; }
  .split-legend .sw { width: 12px; height: 12px; border-radius: 4px; }
  .split-legend .v { font-weight: 600; font-variant-numeric: tabular-nums; text-align: right; }
  .split-legend .p { color: var(--muted); font-variant-numeric: tabular-nums; width: 52px; text-align: right; }
  .split-legend small { display: block; color: var(--muted); font-size: 12px; }
  .total-row { display: flex; justify-content: space-between; align-items: baseline; border-top: 1px solid var(--line); margin-top: 12px; padding-top: 10px; }

  /* bảng */
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { padding: 9px 10px; text-align: right; font-variant-numeric: tabular-nums; border-bottom: 1px solid var(--line); }
  th { font-weight: 500; color: var(--muted); font-size: 12px; }
  th:first-child, td:first-child { text-align: left; }
  tbody tr.current td { background: var(--accent-soft); font-weight: 600; }
  tbody tr.current td:first-child { border-radius: 10px 0 0 10px; } tbody tr.current td:last-child { border-radius: 0 10px 10px 0; }
  td.src { text-align: left; color: var(--muted); font-size: 12px; }
  .scroll { overflow-x: auto; }

  /* phân tích */
  .finding { display: grid; grid-template-columns: clamp(300px, 24%, 420px) 1fr; gap: 28px; align-items: start; }
  @media (max-width: 980px) { .finding { grid-template-columns: 1fr; } }
  .finding .big { font-size: 40px; font-weight: 700; letter-spacing: -0.03em; line-height: 1; margin: 14px 0 4px; font-variant-numeric: tabular-nums; }
  .finding .stat { color: var(--ink-2); font-size: 12.5px; font-variant-numeric: tabular-nums; }
  .so-what { margin-top: 14px; background: var(--accent-soft); border-radius: var(--r-md); padding: 12px 14px; font-size: 13.5px; }
  .so-what b { display: block; font-size: 12px; color: var(--accent); margin-bottom: 2px; }
  .caveat { margin-top: 10px; color: var(--muted); font-size: 12.5px; }
  .stack { display: grid; gap: 16px; margin-top: 16px; }
  .legend { display: flex; gap: 16px; flex-wrap: wrap; font-size: 12.5px; color: var(--ink-2); margin-top: 6px; }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .legend i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }
  table.model-tbl td, table.model-tbl th { text-align: left; vertical-align: top; font-variant-numeric: normal; }
  table.model-tbl td { font-size: 12.5px; line-height: 1.5; }
  table.model-tbl td:first-child { font-weight: 600; min-width: 150px; }
  table.model-tbl code { font-size: 11.5px; background: var(--card-2); border-radius: 5px; padding: 1px 5px; }
  table.model-tbl .grp td { background: var(--card-2); font-weight: 600; color: var(--ink-2); font-size: 12px; }
  /* thanh điều chỉnh gọn: hiện ở đầu trang khi khung điều chỉnh chính đã cuộn khuất */
  .mini-bar { position: fixed; top: 0; left: 0; right: 0; z-index: 25; border-bottom: 1px solid var(--line);
              background: color-mix(in srgb, var(--card) 94%, transparent); backdrop-filter: blur(8px); box-shadow: var(--shadow); }
  .mini-in { max-width: 2200px; margin: 0 auto; padding: 8px clamp(14px, 2vw, 36px); display: flex; align-items: center; gap: 10px 14px; flex-wrap: wrap; }
  .mini-in .lbl { font-size: 12.5px; color: var(--ink-2); font-weight: 500; }
  .mini-in input[type=number] { width: 64px; border: 1px solid var(--line-2); border-radius: 8px; background: var(--card-2); padding: 3px 8px;
                                font-size: 15px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .mini-in input[type=range] { flex: 1 1 160px; min-width: 120px; max-width: 420px; height: 22px; }
  .mini-in .u { color: var(--muted); font-size: 12px; margin-left: -8px; }
  .mini-in .sep { width: 1px; height: 22px; background: var(--line-2); }
  @media (prefers-reduced-motion: no-preference) { .mini-bar { animation: mini-in .18s ease-out; } }
  @keyframes mini-in { from { transform: translateY(-100%); } to { transform: none; } }
  .cmp-take { margin: 0 0 12px; font-size: 13.5px; font-weight: 500; color: var(--ink); max-width: 760px; }
  .pagehead .brief { font-size: 13px; color: var(--accent); font-weight: 600; margin: 0 0 6px; max-width: 900px; }
  .term { border-bottom: 1px dotted currentColor; cursor: help; }
  .presets { display: flex; gap: 4px; margin-top: 6px; flex-wrap: wrap; }
  .presets button { border: 1px solid var(--line-2); background: var(--card); border-radius: 999px; padding: 1px 8px; font-size: 11px; color: var(--ink-2); cursor: pointer; }
  .presets button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }
  .macro-row { display: flex; align-items: center; gap: 12px 16px; flex-wrap: wrap; margin-top: 16px; padding-top: 14px; border-top: 1px solid var(--line); }
  .macro-row .lbl { font-size: 13px; font-weight: 600; }
  .macro-row .hint { color: var(--muted); font-size: 12.5px; flex: 1 1 320px; }
  table.matrix td { text-align: center; vertical-align: top; cursor: pointer; line-height: 1.45; }
  table.matrix td .m1 { font-weight: 600; font-size: 14px; }
  table.matrix td .m2 { color: var(--muted); font-size: 11.5px; }
  table.matrix th:first-child, table.matrix td:first-child { text-align: left; cursor: default; }
  table.matrix td.sel { background: var(--accent-soft); border-radius: 10px; }
  .macro-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 220px), 1fr)); gap: 16px 24px; margin-top: 14px; }
  .econ-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 600px), 1fr)); gap: 16px; margin-top: 14px; }
  .econ { background: var(--card-2); border-radius: var(--r-md); padding: 16px 18px; min-width: 0; }
  .econ h3 { margin: 0 0 6px; font-size: 14.5px; font-weight: 600; line-height: 1.35; }
  .econ .spec { font-size: 12px; color: var(--ink-2); background: var(--card); border-radius: 6px; padding: 2px 6px; }
  .econ .stat { color: var(--muted); font-size: 12px; margin: 8px 0 4px; font-variant-numeric: tabular-nums; }
  .econ td:first-child, .econ th:first-child { text-align: left; }
  .econ td.ci { width: 116px; padding: 4px 6px; }
  .econ table { font-size: 12.5px; } .econ th { white-space: nowrap; }
  .econ td:first-child { min-width: 150px; }

  /* phương pháp */
  .flags { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
  .flags li { display: grid; grid-template-columns: 20px 1fr; gap: 8px; font-size: 13px; }
  .flags li::before { content: "✓"; color: var(--good); font-weight: 700; }
  .flags li.w::before { content: "!"; color: var(--warn); }
  dl.formulas { display: grid; grid-template-columns: max-content 1fr; gap: 8px 16px; margin: 0; font-size: 13px; }
  dl.formulas dt { font-weight: 600; } dl.formulas dd { margin: 0; color: var(--ink-2); }

  #tip { position: fixed; z-index: 30; pointer-events: none; display: none; max-width: 300px; background: var(--card); color: var(--ink);
         border: 1px solid var(--line-2); border-radius: 12px; box-shadow: var(--shadow); padding: 10px 12px; font-size: 12.5px; line-height: 1.5;
         font-variant-numeric: tabular-nums; }
  #tip b { font-weight: 600; }
  footer { margin-top: 28px; color: var(--muted); font-size: 12px; }
  [hidden] { display: none !important; }
  @media (prefers-reduced-motion: no-preference) { .meter > span, .split > div { transition: width .25s ease; } }
</style>
</head>
<body>
<div class="wrap">
  <nav class="topbar" data-t-aria="nav">
    <div class="brand">
      <svg viewBox="0 0 28 28" aria-hidden="true"><rect width="28" height="28" rx="8" fill="var(--hero)"/>
        <path d="M7 9 L13 15 L16 12 L21 18" stroke="#4fc3d9" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M17 18 H21 V14" stroke="#4fc3d9" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
      Rate Cut Lab
    </div>
    <div class="tabs" role="tablist">
      <button role="tab" aria-selected="true" data-tab="sim" data-t="tabSim"></button>
      <button role="tab" aria-selected="false" data-tab="met" data-t="tabMet"></button>
    </div>
    <span class="spacer"></span>
    <button class="theme-btn" id="lang" type="button"></button>
    <button class="theme-btn" id="theme" type="button"></button>
  </nav>

  <header class="pagehead">
    <div>
      <p class="brief" data-t="brief"></p>
      <h1 id="title">…</h1>
      <p id="subtitle"></p>
    </div>
    <div class="pickers">
      <div class="pill-select"><label for="bank" data-t="bank"></label><select id="bank"></select></div>
      <div class="pill-select"><label for="year" data-t="year"></label><select id="year"></select></div>
    </div>
  </header>

  <!-- ===================== MÔ PHỎNG ===================== -->
  <main id="tab-sim">
    <section class="card" id="controls">
      <div class="control">
        <div>
          <div class="bp-big"><input id="bp" type="number" min="0" max="500" step="1" value="25">
            <span class="unit" id="bp-unit"></span><span class="eq num" id="bp-pct"></span></div>
        </div>
        <div class="slider-row">
          <input id="bpRange" type="range" min="0" max="300" step="1" value="25">
          <div class="chips" id="chips"></div>
        </div>
      </div>
      <div class="assump">
        <div class="field"><label for="alpha" data-th="alpha"></label><div class="in"><input id="alpha" type="number" min="0" max="100" value="100"><span class="u">%</span></div></div>
        <div class="field"><label for="months" data-th="months"></label><div class="in"><input id="months" type="number" min="0" max="12" step="0.5" value="12"><span class="u" data-t="monthsU"></span></div></div>

<script>
(() => {
  'use strict';
  const DATA = window.BANK_DATA, META = window.BANK_META;
  const ECON = window.ECON || { models: [], scenarios: [] };
  const $ = id => document.getElementById(id);
  const CAR_MIN = 0.08;  // tỷ lệ an toàn vốn tối thiểu theo Thông tư 41/2016/TT-NHNN

  // ---------- ngôn ngữ ----------
  // bộ nhớ trình duyệt có thể bị chặn (trang nhúng, chế độ riêng tư): lỗi thì bỏ qua, trang vẫn chạy
  const store = { get: k => { try { return localStorage.getItem(k); } catch (e) { return null; } },
                  set: (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} } };
  // ?lang=en hoặc #en trên link thắng lựa chọn đã lưu, để gửi link tiếng Anh cho giám khảo
  const S = { tab: 'sim', bank: 'VCB', year: 2025, bp: 25, alpha: 1, months: 12, phi: 0, tax: 0.2, k: 1, q: 0.9, cmp: 'pat', macro: 'base',
    lang: new URLSearchParams(location.search).get('lang') || { '#en': 'en', '#vi': 'vi' }[location.hash] || store.get('rcl-lang') || 'vi' };
  const L = (vi, en) => S.lang === 'en' ? en : vi;
  const LX = (o, k) => S.lang === 'en' && o[k + '_en'] != null ? o[k + '_en'] : o[k];   // trường song ngữ từ Python

  // φ mặc định = hệ số truyền dẫn khi riêng một ngân hàng đổi lãi (mô hình pass_bank, có hiệu ứng năm)
  const PASS_BANK = ECON.models.find(m => m.id === 'pass_bank'), PASS_MKT = ECON.models.find(m => m.id === 'pass_mkt');
  const coefOf = (m, v) => m ? (m.coefs.find(c => c.var === v) || {}).b : null;
  const PHI_DATA = PASS_BANK ? Math.round(coefOf(PASS_BANK, 'd_yield') * 100) / 100 : 0;
  S.phi = PHI_DATA;

  // ---------- định dạng ----------
  const nf = (d, o = {}) => new Intl.NumberFormat(S.lang === 'en' ? 'en-US' : 'vi-VN', { minimumFractionDigits: d, maximumFractionDigits: d, ...o });
  let f0, f1, f2;
  const setFmt = () => { f0 = nf(0); f1 = nf(1); f2 = nf(2); };
  setFmt();
  const ok = v => v != null && isFinite(v);
  const ty = v => ok(v) ? f0.format(v) : '–';
  const pct = (v, d = 1) => ok(v) ? nf(d).format(v * 100) + '%' : '–';
  const sPct = (v, d = 1) => ok(v) ? (v > 0 ? '+' : v < 0 ? '−' : '') + nf(d).format(Math.abs(v) * 100) + '%' : '–';
  const sTy = v => ok(v) ? (v > 0 ? '+' : v < 0 ? '−' : '') + f0.format(Math.abs(v)) : '–';
  const sNum = (v, d = 1) => ok(v) ? (v > 0 ? '+' : v < 0 ? '−' : '') + nf(d).format(Math.abs(v)) : '–';
  const times = v => ok(v) ? f1.format(v) + L(' lần', '×') : '–';
  const BN = () => L('tỷ', 'bn');                 // đơn vị tiền ngắn
  const BNL = () => L('tỷ đồng', 'VND bn');       // đơn vị tiền đầy đủ
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

  // ---------- chữ tĩnh và thuật ngữ ----------
  const T = {
    nav: ['Điều hướng', 'Navigation'],
    tabSim: ['Mô phỏng', 'Simulator'], tabMet: ['Phương pháp & dữ liệu', 'Method & data'],
    brief: ['Dành cho ALCO/CFO: giảm lãi suất cho vay bao nhiêu thì ngân hàng vẫn giữ được lợi nhuận, an toàn vốn và đệm dự phòng?',
            'For a bank\'s ALCO/CFO: how far can lending rates be cut while the bank keeps its profit, capital and provisioning buffers?'],
    mdTitle: ['Mô hình đề xuất: công thức kế toán + kinh tế lượng', 'Proposed model: accounting formulas + econometrics'],
    mdDesc: ['Mô phỏng tính tác động bằng công thức trên báo cáo tài chính của ngân hàng. Những gì một năm báo cáo không cho biết, như phần chi phí vốn được bù lại hay dự phòng tăng khi kinh tế xấu đi, được ước lượng bằng hồi quy trên {n} ngân hàng × 10 năm.',
             'The simulator computes the impact with formulas on the bank\'s own statements. What a single year cannot tell, such as how much funding cost offsets the cut or how provisions rise in a downturn, is estimated by regressions on {n} banks × 10 years.'],
    varTitle: ['Biến, công thức và nguồn dữ liệu', 'Variables, formulas and data sources'],
    miniBp: ['Mức giảm', 'Rate cut'], miniPhi: ['Chi phí vốn bù', 'Funding offset'],
    bank: ['Ngân hàng', 'Bank'], year: ['Năm nền', 'Base year'],
    bpHint: ['Mức giảm lãi suất cho vay, tính bằng điểm cơ bản: 10 bp = 0,1 điểm %', 'Lending-rate cut in basis points: 10 bp = 0.1 percentage point'],
    monthsU: ['tháng', 'months'],
    mxTitle: ['Mức giảm × kịch bản vĩ mô', 'Rate cut × macro scenario'],
    qaTitle: ['Kiểm tra chất lượng dữ liệu', 'Data quality checks'], qaDesc: ['Tự chạy lại cho ngân hàng và năm đang chọn', 'Re-run for the selected bank and year'],
    fmTitle: ['Công thức', 'Formulas'], fmDesc: ['s là mức giảm (bp); mọi tiền tệ tính bằng tỷ VND', 's is the cut (bp); all money in VND bn'],
    limTitle: ['Giả định và hạn chế', 'Assumptions and limitations'],
    glTitle: ['Thuật ngữ', 'Glossary'], glDesc: ['Rê chuột lên chữ gạch chấm ở bất kỳ đâu để xem giải thích', 'Hover any dotted-underlined term for its definition'],
  };
  // thuật ngữ: [nhãn VI, nhãn EN, giải thích VI, giải thích EN]
  const TERMS = {
    bp: ['bp', 'bp', 'Điểm cơ bản: 1 bp = 0,01 điểm %; 100 bp = 1 điểm %.', 'Basis point: 1 bp = 0.01 percentage point; 100 bp = 1 pp.'],
    pat: ['Lợi nhuận sau thuế', 'Profit after tax', 'LNST: lợi nhuận còn lại cho cổ đông sau chi phí, dự phòng rủi ro tín dụng và thuế.', 'PAT: profit left for shareholders after costs, credit-loss provisions and tax.'],
    cov: ['Khả năng trang trải dự phòng', 'Provision coverage', 'LN trước dự phòng / chi phí dự phòng rủi ro tín dụng. Lợi nhuận hoạt động gấp bao nhiêu lần chi phí dự phòng; dưới 1 lần nghĩa là lỗ trước thuế. ≥ 2 lần: dày; 1–2 lần: mỏng.',
          'Pre-provision profit / credit-loss provisions: how many times operating profit covers provisioning. Below 1× means a pre-tax loss. ≥ 2×: thick; 1–2×: thin.'],
    car: ['Tỷ lệ an toàn vốn (CAR)', 'Capital adequacy ratio (CAR)', 'Vốn tự có / tài sản có rủi ro (RWA). Tối thiểu 8% theo Thông tư 41/2016/TT-NHNN (chuẩn Basel II).',
          'Regulatory capital / risk-weighted assets (RWA). Minimum 8% under SBV Circular 41/2016 (Basel II).'],
    alpha: ['Dư nợ được giảm lãi', 'Loans repriced', 'Tỷ lệ dư nợ cho vay khách hàng được áp mức lãi mới.', 'Share of customer loans that get the lower rate.'],
    months: ['Số tháng hiệu lực bình quân', 'Average months in effect', 'Trung bình bao nhiêu tháng trong 12 tháng tới khoản vay hưởng lãi mới. 12 = áp ngay cho toàn bộ (cận trên); khoản vay lãi cố định chỉ đổi khi đến kỳ định lại.',
             'Average months of the next 12 in which loans carry the new rate. 12 = all loans repriced at once (upper bound); fixed-rate loans change only at repricing.'],
    phi: ['Chi phí vốn giảm theo', 'Funding cost offset', 'Phần khoản giảm lãi được bù lại vì ngân hàng trả lãi tiền gửi thấp hơn. Mặc định lấy từ dữ liệu: khi riêng một ngân hàng đổi lãi, khoảng {phi} được bù (bảng "Mô hình đề xuất" ở tab Phương pháp). 0% = xấu nhất; gần 100% chỉ khi cả thị trường cùng giảm lãi.',
          'Share of the cut recovered because the bank pays depositors less. Default from data: when one bank moves alone, about {phi} is recovered ("Proposed model" table, Method tab). 0% = worst case; close to 100% only in a market-wide easing.'],
    tax: ['Thuế suất TNDN', 'Corporate tax rate', 'Thuế thu nhập doanh nghiệp, 20% ở Việt Nam. Cố định trong mô phỏng.', 'Corporate income tax, 20% in Vietnam. Fixed in the simulator.'],
    k: ['LNST giữ lại vào vốn', 'Profit retained in capital', 'Phần lợi nhuận không chia cổ tức, được cộng vào vốn tự có để tính CAR. Cố định 100% (thận trọng: toàn bộ phần LNST giảm làm giảm vốn).', 'Share of profit not paid out, added to regulatory capital for CAR. Fixed at 100% (conservative: the whole profit loss reduces capital).'],
    q: ['Mục tiêu giữ LNST', 'Profit retention target', 'Tỷ lệ LNST năm nền ngân hàng muốn giữ lại sau khi giảm lãi (đề xuất ALCO: 90%). Cố định 90% trong mô phỏng.', 'Share of base-year profit the bank wants to keep after the cut (ALCO proposal: 90%). Fixed at 90% in the simulator.'],
    macro: ['Kịch bản vĩ mô', 'Macro scenario', 'Kịch bản tăng trưởng kinh tế, đi vào mô phỏng qua chi phí dự phòng (mô hình panel, tab Phương pháp).', 'Economic-growth scenario; enters the simulation through provisions (panel model, Method tab).'],
    nim: ['NIM', 'NIM', 'Biên lãi ròng: thu nhập lãi thuần / tổng tài sản bình quân.', 'Net interest margin: net interest income / average total assets.'],
    ppop: ['LN trước dự phòng', 'Pre-provision profit', 'Lợi nhuận thuần từ hoạt động kinh doanh trước chi phí dự phòng rủi ro tín dụng.', 'Operating profit before credit-loss provisions.'],
    bn: ['tỷ đồng', 'VND bn', '1 tỷ đồng = 1 tỷ (10⁹) VND. Mọi số tiền trên dashboard tính bằng đơn vị này.', '1 VND bn = 1 billion (10⁹) Vietnamese dong (tỷ đồng). All money on the dashboard is in this unit.'],
  };
  const termTip = k => TERMS[k][S.lang === 'en' ? 3 : 2].replace('{phi}', pct(PHI_DATA, 0));
  const term = (k, text) => `<span class="term" tabindex="0" data-tip="${esc(termTip(k))}">${text ?? TERMS[k][S.lang === 'en' ? 1 : 0]}</span>`;
  function applyStatic() {
    document.documentElement.lang = S.lang;
    document.title = 'Rate Cut Lab · ' + L('Mô phỏng giảm lãi suất cho vay', 'Lending-rate cut simulator');
    const smp = META.sample || { banks: banks.length, years: [2016, 2025] };
    document.querySelectorAll('[data-t]').forEach(n => n.textContent = L(...T[n.dataset.t]).replace('{n}', smp.banks).replace('{y}', smp.years.join('–')));
    document.querySelectorAll('[data-th]').forEach(n => n.innerHTML = term(n.dataset.th));
    document.querySelector('.topbar').setAttribute('aria-label', L(...T.nav));
    $('bp-unit').innerHTML = term('bp');
    $('bp').setAttribute('aria-label', L('Mức giảm lãi suất, điểm cơ bản', 'Rate cut, basis points'));
    $('bpRange').setAttribute('aria-label', L('Thanh trượt mức giảm', 'Rate cut slider'));
    $('lang').textContent = S.lang === 'en' ? 'Tiếng Việt' : 'English';
    $('lang').setAttribute('aria-label', L('Chuyển sang tiếng Anh', 'Switch to Vietnamese'));
    $('cmp-seg').innerHTML = [['pat', 'Δ LNST', 'Δ PAT'], ['max', 'Giảm tối đa', 'Max cut'], ['cov', 'Trang trải DP', 'Coverage'], ['car', 'CAR sau', 'CAR after']]
      .map(([m, vi, en]) => `<button data-m="${m}" aria-pressed="${m === S.cmp}">${L(vi, en)}</button>`).join('');
    $('phi-presets').innerHTML = `<button data-phi="${PHI_DATA}" data-tip="${esc(L('Ước lượng khi riêng một ngân hàng giảm lãi (mô hình có hiệu ứng năm)', 'Estimate when one bank cuts alone (model with year effects)'))}">${L('Dữ liệu', 'Data')} ${pct(PHI_DATA, 0)}</button>` +
      `<button data-phi="0" data-tip="${esc(L('Không bù được gì: kịch bản xấu nhất cho ngân hàng', 'No offset: worst case for the bank'))}">${L('Xấu nhất', 'Worst')} 0%</button>`;
    drawLimits(); drawGlossary(); drawModelTable(); drawVars(); paintTheme();
  }

  // ---------- mô hình đề xuất: mắt xích từ mức giảm lãi đến chỉ số an toàn ----------
  function drawModelTable() {
    const M = id => ECON.models.find(m => m.id === id), co = (id, v) => (M(id)?.coefs.find(c => c.var === v)) || {};
    const res = (id, v, txt) => { const c = co(id, v); return c.b == null ? '–' : `${txt(c)} <span style="color:var(--muted)">(p = ${c.p < 0.001 ? '<0.001' : f2.format(c.p)}, n = ${M(id).n})</span>`; };
    const rows = [
      [L('Thu nhập lãi giảm = tiền người vay tiết kiệm', 'Interest income lost = borrower savings'), 'T = E × s; E = ' + L('dư nợ × α × tháng/12', 'loans × α × months/12'),
       L('α, số tháng hiệu lực', 'α, months in effect'), L('Giả định (dữ liệu tổng hợp không có bảng kỳ định lại lãi). Mặc định 12 tháng là cận trên.', 'Assumption (no repricing-gap data). 12-month default is an upper bound.'),
       L('Mọi chỉ số; là quy mô cú sốc', 'All indicators; the size of the shock')],
      [L('Một phần được bù vì trả lãi tiền gửi thấp hơn', 'Part recovered through lower deposit rates'), L('LNTT giảm = T × (1 − φ)', 'Fall in PBT = T × (1 − φ)'),
       'φ', res('pass_bank', 'd_yield', c => L(`<code>pass_bank</code>: φ ≈ ${pct(c.b, 0)} khi một ngân hàng tự giảm lãi (cả thị trường: ${pct(co('pass_mkt', 'd_yield').b, 0)})`, `<code>pass_bank</code>: φ ≈ ${pct(c.b, 0)} when one bank cuts alone (whole market: ${pct(co('pass_mkt', 'd_yield').b, 0)})`)),
       L('LNST, CAR, trang trải DP: φ càng cao, thiệt hại càng nhỏ', 'PAT, CAR, coverage: higher φ, smaller hit')],
      [L('NIM mất chuyển thành ROA mất', 'Lost NIM becomes lost ROA'), L('LNST giảm = LNTT giảm × (1 − thuế), tức 0,8 bp ROA mỗi bp NIM', 'Fall in PAT = fall in PBT × (1 − tax), i.e. 0.8 bp ROA per bp NIM'),
       L('Tỷ lệ chuyển 0,8', 'Pass-through 0.8'), res('roa_det', 'nim', c => L(`<code>roa_det</code>: thực tế ${f2.format(c.b)} < 0,8, ngân hàng bù được một phần`, `<code>roa_det</code>: actual ${f2.format(c.b)} < 0.8, banks offset part`)),
       L('LNST trên dashboard là cận trên của thiệt hại', 'PAT loss shown is an upper bound')],
      [L('Tài sản rủi ro (RWA) có tăng vì tín dụng tăng?', 'Does RWA rise because lending grows?'), L('CAR mới = (Vốn tự có − LNST giảm × k) / RWA, RWA giữ nguyên', 'New CAR = (capital − fall in PAT × k) / RWA, RWA fixed'),
       L('Phản ứng của tín dụng', 'Loan-growth response'), res('loan_resp', 'd_yield', c => L(`<code>loan_resp</code>: không có ý nghĩa, phù hợp cơ chế room tín dụng`, `<code>loan_resp</code>: not significant, consistent with credit quotas`)),
       L('CAR: giữ RWA không đổi là hợp lý', 'CAR: holding RWA fixed is justified')],
      [L('Kinh tế chậm lại làm tăng chi phí dự phòng', 'A slowdown raises provisions'), L('Chi phí DP mới = DP nền + ΔLLP × dư nợ', 'New provisions = base + ΔLLP × loans'),
       L('Độ nhạy của LLP theo GDP', 'LLP sensitivity to GDP'), res('llp_macro', 'gdp_growth', c => L(`<code>llp_macro</code>: GDP −1 điểm % → DP +${f1.format(-c.b * 100)} bp dư nợ (sai số Driscoll-Kraay)`, `<code>llp_macro</code>: GDP −1 pp → provisions +${f1.format(-c.b * 100)} bp of loans (Driscoll-Kraay SE)`)),

  // ---------- biến: công thức, dòng báo cáo tài chính, nơi lấy ----------
