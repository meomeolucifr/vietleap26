      G('Số liệu gốc từ báo cáo tài chính (tỷ đồng)', 'Raw items from the financial statements (VND bn)') +
      R(L('Cho vay khách hàng', 'Customer loans'), 'loans', L('Dư nợ gộp, trước dự phòng', 'Gross, before provisions'), `${BS} · "Cho vay khách hàng"`) +
      R(L('Thu nhập / chi phí lãi', 'Interest income / expense'), 'ii, ie', '—', `${IS} · "Thu nhập lãi và các khoản thu nhập tương tự", "Chi phí lãi và các chi phí tương tự"`) +
      R(L('Thu nhập lãi thuần', 'Net interest income'), 'nii', 'ii − ie', `${IS} · "Thu nhập lãi thuần"`) +
      R(L('LN trước dự phòng; chi phí dự phòng', 'Pre-provision profit; provisions'), 'ppop, prov', '—', `${IS} · "LN thuần từ HĐKD trước chi phí dự phòng rủi ro tín dụng", "Chi phí dự phòng rủi ro tín dụng"`) +
      R(L('LN trước thuế, thuế, LN sau thuế', 'PBT, tax, PAT'), 'pbt, tax, pat', 'pbt − tax = pat', IS) +
      R(L('Tổng tài sản, nợ phải trả, VCSH, tiền gửi KH', 'Total assets, liabilities, equity, deposits'), 'ta, liab, equity, deposits', '—', BS) +
      R(L('Vốn tự có, tài sản có rủi ro, CAR', 'Regulatory capital, RWA, CAR'), 'vtc, rwa, car', 'car = vtc / rwa', L(`${NT} mục "Tỷ lệ an toàn vốn"; báo cáo công bố thông tin rủi ro (Thông tư 41) trên website ngân hàng`, `${NT}, "Capital adequacy ratio"; Pillar 3 disclosure (Circular 41) on the bank's website`)) +
      R(L('Dư nợ theo nhóm nợ 1–5', 'Loans by debt group 1–5'), 'N1..N5', '—', L(`${NT} mục "Phân tích chất lượng nợ cho vay"`, `${NT}, "Loan quality analysis"`)) +
      G('Biến tính toán', 'Derived variables') +
      R(L('Lợi suất tài sản', 'Asset yield'), 'yield', `ii / ${L('TTS', 'TA')} ${avg}`, L('Tính từ trên', 'Computed')) +
      R(L('Chi phí vốn', 'Funding cost'), 'cost', `ie / ${L('nợ phải trả', 'liabilities')} ${avg}`, L('Tính từ trên', 'Computed')) +
      R('NIM, ROA', 'nim, roa', `nii, pat / ${L('TTS', 'TA')} ${avg}`, L('Tính từ trên', 'Computed')) +
      R(L('Chi phí hoạt động / thu nhập', 'Cost / income'), 'cir', L('Chi phí hoạt động / Tổng thu nhập hoạt động', 'Operating expenses / total operating income'), IS) +
      R(L('Tỷ lệ nợ xấu', 'NPL ratio'), 'npl', '(N3 + N4 + N5) / (N1 + … + N5)', NT) +
      R(L('Tỷ lệ chi phí dự phòng', 'Provision rate'), 'llp', `prov / ${L('dư nợ', 'loans')} ${avg}`, L('Tính từ trên', 'Computed')) +
      R(L('Tăng trưởng dư nợ', 'Loan growth'), 'loang', 'loans<sub>t</sub> / loans<sub>t−1</sub> − 1', L('Tính từ trên', 'Computed')) +
      R(L('Vốn chủ / tài sản; quy mô', 'Equity / assets; size'), 'cap, size', 'equity / ta; ln(ta)', L('Tính từ trên', 'Computed')) +
      R(L('Khả năng trang trải dự phòng', 'Provision coverage'), 'cov', 'ppop / prov', L('Tính từ trên', 'Computed')) +
      R(L('Thay đổi so với năm trước', 'Year-on-year change'), 'Δx', 'x<sub>t</sub> − x<sub>t−1</sub>', L('Tính từ trên', 'Computed')) +
      G('Vĩ mô (%/năm, giống nhau cho mọi ngân hàng trong năm)', 'Macro (% a year, same for every bank in a year)') +
      R(L('Tăng trưởng GDP thực', 'Real GDP growth'), 'gdp_growth', L('Giá so sánh, so với năm trước', 'Constant prices, year on year'), L('Cục Thống kê (nso.gov.vn), thông cáo tình hình kinh tế – xã hội quý IV hằng năm', 'National Statistics Office (nso.gov.vn), annual Q4 socio-economic release')) +
      R(L('Lạm phát CPI bình quân', 'Average CPI inflation'), 'cpi_avg', L('Bình quân 12 tháng của CPI so cùng kỳ', '12-month average of year-on-year CPI'), L('Cục Thống kê (nso.gov.vn), cùng thông cáo; công bố sẵn số bình quân năm', 'National Statistics Office (nso.gov.vn), same release; annual average published directly')) +
      R(L('Lãi suất huy động trên 12 tháng', 'Deposit rate above 12 months'), 'deposit_rate_12m', L('Trung điểm khoảng lãi suất, tháng 12', 'Midpoint of the published range, December'), L('Ngân hàng Nhà nước (sbv.gov.vn), mục thống kê lãi suất', 'State Bank of Vietnam (sbv.gov.vn), interest-rate statistics')) +
      R(L('Tăng trưởng tín dụng toàn hệ thống', 'System credit growth'), 'credit_growth', L('Dư nợ tháng 12 so cùng kỳ', 'December outstanding credit, year on year'), L('Ngân hàng Nhà nước (sbv.gov.vn), thống kê tiền tệ', 'State Bank of Vietnam (sbv.gov.vn), monetary statistics')) +
      `</tbody>`;
  }

  // ---------- dữ liệu ----------
  const banks = [...new Set(DATA.map(r => r.bank))].sort();
  const row = (b, y) => DATA.find(r => r.bank === b && r.year === y);
  const yearsOf = b => DATA.filter(r => r.bank === b && r.pat != null && r.loans != null).map(r => r.year).sort((a, c) => c - a);

  // ---------- vốn ----------
  function capitalBase(r) {
    const calc = r.vtc && r.rwa ? r.vtc / r.rwa : null;
    if (calc != null && (r.car_rep == null || Math.abs(calc - r.car_rep) < 0.003))
      return { car0: r.car_rep ?? calc, rwa: r.rwa, est: false,
               note: r.car_rep == null ? L('CAR = vốn tự có / RWA (không có CAR công bố để đối chiếu)', 'CAR = capital / RWA (no reported CAR to cross-check)')
                                       : L('Vốn tự có / RWA khớp CAR công bố trong ±0,3 điểm %', 'Capital / RWA matches reported CAR within ±0.3 pp') };
    if (r.car_rep) {
      const base = r.vtc ?? r.equity;
      return { car0: r.car_rep, rwa: base / r.car_rep, est: true,
               note: calc != null ? L(`Vốn tự có / RWA = ${pct(calc, 2)}, lệch CAR công bố ${pct(r.car_rep, 2)}; dùng CAR công bố, RWA suy ra = vốn tự có / CAR`,
                                      `Capital / RWA = ${pct(calc, 2)}, differs from reported CAR ${pct(r.car_rep, 2)}; reported CAR used, RWA implied = capital / CAR`)
                                  : L('Thiếu vốn tự có/RWA; RWA ước tính = VCSH / CAR công bố (giả định vốn tự có ≈ VCSH)', 'Capital/RWA missing; RWA estimated = equity / reported CAR (assumes capital ≈ equity)') };
    }
    return null;
  }

  // ---------- mô hình ----------
  const scen = id => ECON.scenarios.find(x => x.id === id && x.dllp) || null;
  function sim(r, bp, p = S) {
    const E = r.loans * p.alpha * p.months / 12;      // dư nợ hiệu lực cả năm
    const save = E * bp / 1e4;                         // người vay tiết kiệm = thu nhập lãi giảm (gộp)
    const dep = save * p.phi;                          // phần chi phí vốn giảm bù lại (người gửi tiền gánh)
    const dPBT = save - dep;                           // LNTT giảm
    const tax = dPBT * p.tax;                          // ngân sách thu ít hơn
    const dPAT = dPBT - tax;                           // cổ đông ngân hàng gánh
    // kênh vĩ mô, tách riêng khỏi kênh giảm lãi: kịch bản đổi tỷ lệ chi phí dự phòng (mô hình llp_macro)
    const sc = scen(p.macro), dProv = sc ? sc.dllp * r.loans : 0, dProvAT = dProv * (1 - p.tax);
    const pat1 = r.pat - dPAT - dProvAT, ppop1 = r.ppop - dPBT, nii1 = r.nii - dPBT, prov1 = r.prov + dProv;
    const cap = capitalBase(r);
    const car1 = cap ? cap.car0 - (dPAT + dProvAT) * p.k / cap.rwa : null;
    const unit = E * (1 - p.phi) * (1 - p.tax) / 1e4;  // LNST mất cho mỗi bp
    return { E, save, dep, dPBT, tax, dPAT, dProv, dProvAT, prov1, pat1, ppop1, nii1, cap, car1,
      dCarBp: cap ? (car1 - cap.car0) * 1e4 : null,
      patChg: r.pat > 0 ? (pat1 - r.pat) / r.pat : null, retain: r.pat > 0 ? pat1 / r.pat : null,
      cov0: r.prov > 0 ? r.ppop / r.prov : null, cov1: prov1 > 0 ? ppop1 / prov1 : null, buffer: ppop1 - prov1,
      maxBp: r.pat > 0 && unit > 0 ? Math.max(0, ((1 - p.q) * r.pat - dProvAT) / unit) : null,
      beBp: r.pbt > 0 && unit > 0 ? Math.max(0, (r.pbt - dProv) / (E * (1 - p.phi)) * 1e4) : null,
      perBillion: bp / 1e4 * 1000 };
  }

  // ---------- tooltip ----------
  const tip = $('tip');
  function showTip(html, ev) {
    tip.innerHTML = html; tip.style.display = 'block';
    const w = tip.offsetWidth, h = tip.offsetHeight;
    let x = ev.clientX + 14, y = ev.clientY + 14;
    if (x + w > innerWidth - 8) x = ev.clientX - w - 14;
    if (y + h > innerHeight - 8) y = ev.clientY - h - 14;
    tip.style.left = x + 'px'; tip.style.top = y + 'px';
  }
  const hideTip = () => { tip.style.display = 'none'; };
  document.addEventListener('mousemove', ev => {
    const t = ev.target.closest && ev.target.closest('[data-tip]');
    if (t) showTip(t.getAttribute('data-tip'), ev); else if (!(ev.target.closest && ev.target.closest('.hit'))) hideTip();
  });
  document.addEventListener('focusin', ev => {
    const t = ev.target.closest && ev.target.closest('[data-tip]');
    if (t) { const b = t.getBoundingClientRect(); showTip(t.getAttribute('data-tip'), { clientX: b.left, clientY: b.bottom }); }
  });
  document.addEventListener('focusout', hideTip);

  // ---------- tiện ích vẽ ----------
  function ticks(min, max, n = 5) {
    const span = max - min || 1, raw = span / n, mag = Math.pow(10, Math.floor(Math.log10(raw)));
    const step = [1, 2, 2.5, 5, 10].map(m => m * mag).find(s => span / s <= n) || 10 * mag;
    const out = []; for (let v = Math.floor(min / step) * step; v <= Math.ceil(max / step) * step + step / 2; v += step) out.push(+v.toFixed(10));
    return out;
  }
  const W = el => Math.max(300, el.clientWidth);
  const badge = (cls, icon, text) => `<span class="badge b-${cls}"><i aria-hidden="true">${icon}</i>${text}</span>`;
  const gradDefs = id => `<defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--accent)" stop-opacity=".28"/><stop offset="1" stop-color="var(--accent)" stop-opacity="0"/></linearGradient>
    <linearGradient id="${id}h" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="var(--accent-2)"/><stop offset="1" stop-color="var(--accent)"/></linearGradient></defs>`;
  const fx = txt => `<button class="formula-btn" type="button" data-tip="${esc(txt)}">${L('Cách tính', 'How it\'s computed')}</button>`;
  const scLabel = sc => sc ? LX(sc, 'label') : '';

  // ---------- tiêu đề ----------
  function drawHead(r, s) {
    let t;
    const q = f0.format(S.q * 100);
    if (!(r.pat > 0)) t = L(`${r.bank} lỗ trong năm ${r.year}: mọi mức giảm lãi đều làm khoản lỗ sâu thêm`, `${r.bank} made a loss in ${r.year}: any rate cut deepens it`);
    else if (s.maxBp == null) t = L(`Với giả định hiện tại, giảm lãi không làm ${r.bank} mất lợi nhuận`, `Under these assumptions a rate cut costs ${r.bank} no profit`);
    else if (s.maxBp < 1) t = L(`Trong kịch bản ${scLabel(scen(S.macro)).toLowerCase()}, ${r.bank} không còn dư địa giảm lãi mà vẫn giữ ${q}% lợi nhuận`,
                                `In the ${scLabel(scen(S.macro)).toLowerCase()} scenario, ${r.bank} has no room to cut and still keep ${q}% of profit`);
    else t = L(`${r.bank} giảm được tối đa ${f0.format(Math.floor(s.maxBp))} bp mà vẫn giữ ${q}% lợi nhuận`, `${r.bank} can cut lending rates by up to ${f0.format(Math.floor(s.maxBp))} bp and keep ${q}% of profit`);
    $('title').textContent = t;
    const chg = r.pat > 0 ? (s.patChg < 0 ? L('giảm ', 'falls ') : L('tăng ', 'rises ')) + pct(Math.abs(s.patChg)) : L('đổi ', 'changes by ') + sTy(s.pat1 - r.pat) + ' ' + BN();
    $('subtitle').textContent = L(`Ở mức ${f0.format(S.bp)} bp, người vay tiết kiệm ${ty(s.save)} tỷ đồng mỗi năm, còn lợi nhuận sau thuế ${chg}`,
                                  `At ${f0.format(S.bp)} bp, borrowers save VND ${ty(s.save)} bn a year and profit after tax ${chg}`) +
      (s.dProv ? L(` (đã tính kịch bản vĩ mô ${scLabel(scen(S.macro)).toLowerCase()})`, ` (including the ${scLabel(scen(S.macro)).toLowerCase()} macro scenario)`) : '') +
      L(`. Tính trên báo cáo tài chính hợp nhất ${r.year}.`, `. Based on the ${r.year} consolidated financial statements.`);
  }

  // ---------- KPI ----------
  function drawKpis(r, s) {
    $('kpi-save').innerHTML = `
      <div class="k-top"><span class="k-label">${L('Người vay tiết kiệm', 'Borrower savings')}</span><span class="tag num">${L('12 tháng', '12 months')}</span></div>
      <div class="k-value">${ty(s.save)} <small>${BNL()}</small></div>
      <div class="k-sub">${L(`${f2.format(s.perBillion)} triệu đồng/năm cho mỗi 1 tỷ đồng dư nợ được giảm lãi`, `VND ${f2.format(s.perBillion)} million a year for every VND 1 bn of loans repriced`)}</div>
      <div class="k-sub" style="margin-top:10px">${L(`Tương đương <b style="color:#fff">${pct(s.save / r.ii)}</b> thu nhập lãi năm ${r.year} của ${r.bank}`,
                                                     `Equal to <b style="color:#fff">${pct(s.save / r.ii)}</b> of ${r.bank}'s ${r.year} interest income`)}</div>
      <div class="k-foot">${fx(L(`<b>Tiết kiệm = Dư nợ hiệu lực × s</b><br>Dư nợ hiệu lực = ${ty(r.loans)} × ${f0.format(S.alpha * 100)}% × ${f1.format(S.months)}/12 = ${ty(s.E)} tỷ<br>× ${f2.format(S.bp / 100)}% = <b>${ty(s.save)} tỷ</b>`,
                                 `<b>Savings = effective loans × s</b><br>Effective loans = ${ty(r.loans)} × ${f0.format(S.alpha * 100)}% × ${f1.format(S.months)}/12 = ${ty(s.E)} bn<br>× ${f2.format(S.bp / 100)}% = <b>${ty(s.save)} bn</b>`))}</div>`;

    const q = f0.format(S.q * 100);
    const patB = s.retain == null ? badge('na', '–', L('LNST nền ≤ 0', 'Base PAT ≤ 0')) : s.retain >= S.q ? badge('good', '✓', L(`Đạt mục tiêu ${q}%`, `Meets ${q}% target`)) : badge('crit', '!', L(`Dưới mục tiêu ${q}%`, `Below ${q}% target`));
    const keep = Math.max(0, Math.min(1, s.retain ?? 0));
    $('kpi-pat').innerHTML = `
      <div class="k-top"><span class="k-label">${term('pat')}</span>${patB}</div>
      <div class="k-value">${r.pat > 0 ? sPct(s.patChg) : sTy(s.pat1 - r.pat) + ` <small>${BN()}</small>`}</div>
      <div class="k-sub">${ty(r.pat)} → <b>${ty(s.pat1)}</b> ${BNL()}</div>
      ${r.pat > 0 ? `<div class="meter" role="img" aria-label="${L('Giữ', 'Keeps')} ${pct(s.retain)}, ${L('mục tiêu', 'target')} ${pct(S.q, 0)}"><span style="width:${keep * 100}%"></span><b style="left:calc(${S.q * 100}% - 1px)"></b></div>
      <div class="meter-legend"><span>${L('Giữ lại', 'Kept')} ${pct(s.retain)}</span><span>${L('Mục tiêu', 'Target')} ${pct(S.q, 0)}</span></div>` : ''}
      <div class="k-foot">${fx(L(`<b>ΔLNST do giảm lãi = Tiết kiệm × (1 − bù chi phí vốn) × (1 − thuế)</b><br>= ${ty(s.save)} × ${f0.format((1 - S.phi) * 100)}% × ${f0.format((1 - S.tax) * 100)}% = <b>${ty(s.dPAT)} tỷ</b>`,
                                 `<b>ΔPAT from the cut = savings × (1 − funding offset) × (1 − tax)</b><br>= ${ty(s.save)} × ${f0.format((1 - S.phi) * 100)}% × ${f0.format((1 - S.tax) * 100)}% = <b>${ty(s.dPAT)} bn</b>`) +
        (s.dProv ? L(`<br><b>ΔLNST do vĩ mô = ΔDP × (1 − thuế)</b> = ${sTy(s.dProv)} × ${f0.format((1 - S.tax) * 100)}% = <b>${sTy(s.dProvAT)} tỷ</b><br>ΔDP = ${sNum(scen(S.macro).dllp * 1e4)} bp × dư nợ ${ty(r.loans)}`,
                     `<br><b>ΔPAT from macro = Δprovisions × (1 − tax)</b> = ${sTy(s.dProv)} × ${f0.format((1 - S.tax) * 100)}% = <b>${sTy(s.dProvAT)} bn</b><br>Δprovisions = ${sNum(scen(S.macro).dllp * 1e4)} bp × loans ${ty(r.loans)}`) : '') +
        L(`<br>% = (LNST mới − LNST nền) / ${ty(r.pat)}`, `<br>% = (new PAT − base PAT) / ${ty(r.pat)}`))}</div>`;

    const covB = s.cov1 == null ? badge('na', '–', L('Không có chi phí DP', 'No provisions')) : s.cov1 >= 2 ? badge('good', '✓', L('Dày', 'Thick')) : s.cov1 >= 1 ? badge('warn', '!', L('Mỏng', 'Thin')) : badge('crit', '✕', L('Không đủ', 'Insufficient'));
    $('kpi-cov').innerHTML = `
      <div class="k-top"><span class="k-label">${term('cov')}</span>${covB}</div>
      <div class="k-value">${times(s.cov1)}</div>
      <div class="k-sub">${L(`Năm nền ${times(s.cov0)}. Lợi nhuận còn gánh thêm được <b>${ty(s.buffer)}</b> tỷ dự phòng trước khi chuyển sang lỗ`, `Base year ${times(s.cov0)}. Profit can absorb <b>${ty(s.buffer)}</b> bn more provisions before turning into a loss`)}</div>
      <div class="k-foot">${fx(L(`<b>(LN trước dự phòng − ΔLNTT do giảm lãi) / Chi phí dự phòng</b><br>= (${ty(r.ppop)} − ${ty(s.dPBT)}) / ${ty(s.prov1)} = <b>${times(s.cov1)}</b>`,
                                 `<b>(Pre-provision profit − ΔPBT from the cut) / provisions</b><br>= (${ty(r.ppop)} − ${ty(s.dPBT)}) / ${ty(s.prov1)} = <b>${times(s.cov1)}</b>`) +
        (s.dProv ? L(`<br>Chi phí dự phòng = nền ${ty(r.prov)} ${sTy(s.dProv)} theo kịch bản vĩ mô`, `<br>Provisions = base ${ty(r.prov)} ${sTy(s.dProv)} from the macro scenario`) : '') +
        L('<br>Ngưỡng: ≥ 2 lần dày, 1–2 lần mỏng, < 1 lần không đủ', '<br>Thresholds: ≥ 2× thick, 1–2× thin, < 1× insufficient'))}</div>`;

    $('kpi-car').innerHTML = `<div class="k-top"><span class="k-label">${term('car', 'CAR')}</span>${
      !s.cap ? badge('na', '–', L('Thiếu dữ liệu', 'No data')) : s.car1 >= CAR_MIN + 0.01 ? badge('good', '✓', L('Trên 8%', 'Above 8%')) : s.car1 >= CAR_MIN ? badge('warn', '!', L('Sát 8%', 'Near 8%')) : badge('crit', '✕', L('Dưới 8%', 'Below 8%'))}</div>` +
      (s.cap ? gauge(s.cap.car0, s.car1) + `<div class="k-sub" style="text-align:center">${pct(s.cap.car0, 2)} → <b>${pct(s.car1, 2)}</b> (${sNum(s.dCarBp)} bp)${s.cap.est ? L(' · ước tính', ' · estimated') : ''}</div>
        <div class="k-foot">${fx(L(`<b>CAR mới = CAR nền − ΔLNST × k / RWA</b>`, `<b>New CAR = base CAR − ΔPAT × k / RWA</b>`) + `<br>= ${pct(s.cap.car0, 2)} − ${ty(s.dPAT + s.dProvAT)} × ${f0.format(S.k * 100)}% / ${ty(s.cap.rwa)}<br>${esc(s.cap.note)}`)}</div>`
        : `<div class="k-value">–</div><div class="k-sub">${L(`Nguồn không có CAR, vốn tự có hay RWA cho ${r.bank} ${r.year}`, `No CAR, capital or RWA in the source for ${r.bank} ${r.year}`)}</div>`);
  }
  // đồng hồ bán nguyệt: thang 0–20%, vạch ở 8%
  function gauge(c0, c1) {
    const w = 220, h = 120, cx = w / 2, cy = 108, R = 90, max = 0.2, n = 36;
    const ang = v => Math.PI * (1 - Math.max(0, Math.min(max, v)) / max);
    let g = '';
    for (let i = 0; i < n; i++) {
      const a = Math.PI * (1 - (i + 0.5) / n), v = (i + 0.5) / n * max, on = v <= c1;
      const x1 = cx + (R - 16) * Math.cos(a), y1 = cy - (R - 16) * Math.sin(a), x2 = cx + R * Math.cos(a), y2 = cy - R * Math.sin(a);
      // phần đã lấp: gradient; vùng dưới 8% chưa lấp: đỏ nhạt để đánh dấu vùng vi phạm
      const stroke = on ? 'url(#gg)' : v < CAR_MIN ? 'var(--crit-soft)' : 'var(--line)';
      g += `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${on && c1 < CAR_MIN ? 'var(--crit)' : stroke}" stroke-width="5" stroke-linecap="round"/>`;
    }
    const am = ang(CAR_MIN), a0 = ang(c0);
    g += `<line x1="${cx + (R - 22) * Math.cos(am)}" y1="${cy - (R - 22) * Math.sin(am)}" x2="${cx + (R + 6) * Math.cos(am)}" y2="${cy - (R + 6) * Math.sin(am)}" stroke="var(--ink)" stroke-width="2"/>
      <text class="t-tick" x="${cx + (R + 14) * Math.cos(am)}" y="${cy - (R + 14) * Math.sin(am)}" text-anchor="end">8%</text>
      <circle cx="${cx + (R + 6) * Math.cos(a0)}" cy="${cy - (R + 6) * Math.sin(a0)}" r="3" fill="var(--muted)"><title>${L('CAR nền', 'Base CAR')}</title></circle>
      <text x="${cx}" y="${cy - 14}" text-anchor="middle" style="font-size:30px;font-weight:700;fill:var(--ink);letter-spacing:-0.03em" class="num">${pct(c1, 2)}</text>
      <text class="t-tick" x="${cx}" y="${cy + 4}" text-anchor="middle">${L('CAR sau giảm lãi', 'CAR after the cut')}</text>`;
    return `<svg viewBox="0 0 ${w} ${h + 6}" style="width:100%;max-width:240px;margin:6px auto 0;display:block" role="img" aria-label="${L('CAR sau giảm lãi', 'CAR after the cut')} ${pct(c1, 2)}, min 8%">
      <defs><linearGradient id="gg" x1="0" x2="1"><stop offset="0" stop-color="var(--accent-2)"/><stop offset="1" stop-color="var(--accent)"/></linearGradient></defs>${g}</svg>`;
  }

  // ---------- độ nhạy ----------
  function drawSens(r, s) {
    const el = $('chart-sens'), w = W(el), h = Math.round(Math.max(280, Math.min(360, w * 0.24))), m = { t: 20, r: 80, b: 40, l: 48 };
    if (!(r.pat > 0)) {
      $('sens-desc').textContent = '';
      el.innerHTML = `<p class="desc">${L('LNST năm nền ≤ 0 nên không tính được tỷ lệ giữ lại. Chọn năm hoặc ngân hàng khác.', 'Base-year profit ≤ 0, so retention cannot be computed. Pick another year or bank.')}</p>`; return;
    }
    // mô hình là tuyến tính theo mức giảm (mỗi bp mất cùng một khoản), nên thông tin đáng giá nằm ở độ dốc,
    // độ bất định của φ (khoảng tin cậy 95% của mô hình pass_bank) và khác biệt giữa các kịch bản vĩ mô
    const ci = PASS_BANK && Math.abs(S.phi - PHI_DATA) < 1e-9 ? PASS_BANK.coefs.find(c => c.var === 'd_yield') : null;
    const xmax = Math.max(200, Math.ceil(S.bp * 1.4 / 50) * 50, s.maxBp ? Math.min(500, Math.ceil(s.maxBp * 1.3 / 50) * 50) : 0);
    const curve = p => Array.from({ length: 121 }, (_, i) => { const b = xmax * i / 120; return [b, sim(r, b, { ...S, ...p }).retain]; });
    const pts = curve({}), lo = ci ? curve({ phi: ci.lo }) : null, hi = ci ? curve({ phi: ci.hi }) : null;
    const alt = ECON.scenarios.filter(sc => sc.id !== S.macro).map(sc => ({ sc, pts: curve({ macro: sc.id }) }));
    const per10 = sim(r, 0).retain - sim(r, 10).retain;
    const mx = ci ? [sim(r, S.bp, { ...S, phi: ci.lo }).maxBp, sim(r, S.bp, { ...S, phi: ci.hi }).maxBp] : null;
    $('sens-desc').textContent = L(`Mỗi 10 bp giảm lãi, ${r.bank} mất khoảng ${pct(per10)} lợi nhuận; vùng xanh là các mức vẫn đạt mục tiêu.`, `Every 10 bp cut costs ${r.bank} about ${pct(per10)} of profit; the green zone still meets the target.`) +
      (mx && ok(mx[0]) && ok(mx[1]) ? L(` Tính cả độ bất định của phần bù chi phí vốn, mức giảm tối đa nằm trong khoảng ${f0.format(Math.floor(mx[0]))}–${f0.format(Math.floor(mx[1]))} bp.`,
                                       ` Allowing for uncertainty in the funding offset, the maximum cut lies between ${f0.format(Math.floor(mx[0]))} and ${f0.format(Math.floor(mx[1]))} bp.`) : '');
    const allY = [pts, lo || [], ...alt.map(a => a.pts)].flat().map(p => p[1]);
    // trần trục: 100%, trừ khi kịch bản thuận lợi đẩy lợi nhuận lên trên mức năm nền
    const yTop = Math.max(1, ...allY);
    const yt = ticks(Math.min(0.5, ...allY, S.q - 0.05), yTop, 5).filter(v => v <= yTop + 1e-9), y0 = yt[0], y1 = yTop;
    const x = v => m.l + v / xmax * (w - m.l - m.r), y = v => m.t + (1 - (v - y0) / (y1 - y0)) * (h - m.t - m.b);
    let g = gradDefs('sg');
    yt.forEach(v => g += `<line x1="${m.l}" x2="${w - m.r}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text class="t-tick" x="${m.l - 8}" y="${y(v) + 4}" text-anchor="end">${f0.format(v * 100)}%</text>`);
    ticks(0, xmax, 6).filter(v => v <= xmax).forEach(v => g += `<text class="t-tick" x="${x(v)}" y="${h - m.b + 18}" text-anchor="middle">${f0.format(v)}</text>`);
    g += `<text class="t-tick" x="${(m.l + w - m.r) / 2}" y="${h - 3}" text-anchor="middle">${L('Mức giảm lãi suất (bp)', 'Lending-rate cut (bp)')}</text>`;
    if (s.maxBp > 0) {
      const xm = x(Math.min(s.maxBp, xmax));
      g += `<rect x="${m.l}" y="${m.t}" width="${xm - m.l}" height="${h - m.t - m.b}" fill="var(--good)" opacity=".07" rx="6"/>`;
      if (s.maxBp <= xmax) g += `<line x1="${xm}" x2="${xm}" y1="${m.t}" y2="${h - m.b}" stroke="var(--good)" stroke-dasharray="3 4"/>
        <text class="t-strong" x="${xm + 6}" y="${m.t + 12}" style="fill:var(--good)">${L('Tối đa', 'Max')} ${f1.format(s.maxBp)} bp</text>`;
    }
    const path = P => P.map((p, i) => (i ? 'L' : 'M') + x(p[0]).toFixed(1) + ',' + y(p[1]).toFixed(1)).join('');
    if (ci) g += `<path d="${path(hi)}${path(lo.slice().reverse()).replace('M', 'L')}Z" fill="var(--accent)" opacity=".14"/>`;
    // nhãn ở cuối đường: đường cao hơn ghi phía trên, đường thấp hơn ghi phía dưới, để hai nhãn không đè nhau
    alt.slice().sort((a, b) => b.pts[b.pts.length - 1][1] - a.pts[a.pts.length - 1][1]).forEach((a, i) => {
      const end = a.pts[a.pts.length - 1];
      g += `<path d="${path(a.pts)}" fill="none" stroke="var(--ink-2)" stroke-width="1.5" stroke-dasharray="5 4" opacity=".75"/>
        <text class="t-tick" x="${x(end[0]) - 4}" y="${y(end[1]) + (i === 0 ? -6 : 14)}" text-anchor="end">${esc(scLabel(a.sc))}</text>`;
    });
    g += `<path d="${path(pts)}" fill="none" stroke="var(--accent)" stroke-width="2.5"/>`;
    g += `<line x1="${m.l}" x2="${w - m.r}" y1="${y(S.q)}" y2="${y(S.q)}" stroke="var(--ink-2)" stroke-dasharray="5 5"/>
      <text class="t-lbl" x="${w - m.r + 6}" y="${y(S.q) + 4}">${L('Mục tiêu', 'Target')} ${f0.format(S.q * 100)}%</text>`;
    // nhãn điểm đang chọn đặt dưới-phải đường để không đè nhãn "Tối đa" ở mép trên
    const cx = x(Math.min(S.bp, xmax)), cy = y(s.retain), right = cx > w - 190;
    g += `<circle cx="${cx}" cy="${cy}" r="6" fill="var(--accent)" stroke="var(--card)" stroke-width="3"/>
      <text class="t-strong" x="${cx + (right ? -12 : 12)}" y="${cy + 22}" text-anchor="${right ? 'end' : 'start'}">${f0.format(S.bp)} bp · ${L('giữ', 'keeps')} ${pct(s.retain)}</text>`;
    g += `<line id="sx" y1="${m.t}" y2="${h - m.b}" stroke="var(--line-2)" visibility="hidden"/><circle id="sd" r="5" fill="var(--card)" stroke="var(--accent)" stroke-width="2" visibility="hidden"/>
      <rect class="hit" x="${m.l}" y="${m.t}" width="${w - m.l - m.r}" height="${h - m.t - m.b}" fill="transparent" style="cursor:crosshair"/>`;
    const cur = ECON.scenarios.find(sc => sc.id === S.macro);
    el.innerHTML = `<svg viewBox="0 0 ${w} ${h}" role="img" aria-label="${L('Đường độ nhạy LNST giữ lại theo mức giảm', 'Profit retained by rate cut')}">${g}</svg>
      <div class="legend"><span><i style="background:var(--accent)"></i>${cur ? L('Kịch bản ', '') + esc(scLabel(cur).toLowerCase()) + L('', ' scenario') : L('Mô phỏng', 'Simulation')}</span>` +
      (ci ? `<span><i style="background:var(--accent);opacity:.3"></i>${L(`Khoảng tin cậy 95% của phần bù chi phí vốn (${pct(ci.lo, 0)}–${pct(ci.hi, 0)})`, `95% confidence interval of the funding offset (${pct(ci.lo, 0)}–${pct(ci.hi, 0)})`)}</span>` : '') +
      (alt.length ? `<span><i style="height:0;width:16px;border-radius:0;border-top:2px dashed var(--ink-2)"></i>${L('Các kịch bản vĩ mô khác', 'Other macro scenarios')}</span>` : '') + `</div>`;
    const svg = el.querySelector('svg'), hit = svg.querySelector('.hit'), sx = svg.querySelector('#sx'), sd = svg.querySelector('#sd');
    let hb = null;
    hit.addEventListener('mousemove', ev => {
      const pt = svg.createSVGPoint(); pt.x = ev.clientX; pt.y = ev.clientY;
      const px = pt.matrixTransform(svg.getScreenCTM().inverse()).x;
      hb = Math.max(0, Math.min(xmax, Math.round((px - m.l) / (w - m.l - m.r) * xmax)));
      const q = sim(r, hb);
      sx.setAttribute('x1', x(hb)); sx.setAttribute('x2', x(hb)); sx.setAttribute('visibility', 'visible');
      sd.setAttribute('cx', x(hb)); sd.setAttribute('cy', y(q.retain)); sd.setAttribute('visibility', 'visible');
      showTip(L(`<b>${f0.format(hb)} bp</b> (${f2.format(hb / 100)} điểm %)<br>Giữ lại ${pct(q.retain)} LNST · còn ${ty(q.pat1)} tỷ<br>Người vay tiết kiệm ${ty(q.save)} tỷ<br>Trang trải dự phòng ${times(q.cov1)}<br><span style="color:var(--muted)">Bấm để chọn mức này</span>`,
                `<b>${f0.format(hb)} bp</b> (${f2.format(hb / 100)} pp)<br>Keeps ${pct(q.retain)} of PAT · ${ty(q.pat1)} bn left<br>Borrowers save ${ty(q.save)} bn<br>Provision coverage ${times(q.cov1)}<br><span style="color:var(--muted)">Click to select this cut</span>`), ev);
    });
    hit.addEventListener('mouseleave', () => { sx.setAttribute('visibility', 'hidden'); sd.setAttribute('visibility', 'hidden'); hideTip(); });
    hit.addEventListener('click', () => { if (hb != null) { hideTip(); setBp(hb); } });
  }

  // ---------- so sánh ngân hàng ----------
  const CMP = {
    pat: { t: () => L('Ngân hàng nào mất nhiều lợi nhuận nhất?', 'Which banks lose the most profit?'), get: s => s.patChg, fmt: v => sPct(v), asc: true, d: () => L('Thanh càng dài, ngân hàng càng mất nhiều lợi nhuận ở cùng mức giảm.', 'The longer the bar, the more profit the bank loses at the same cut.') },
    max: { t: () => L('Ngân hàng nào còn nhiều dư địa giảm lãi?', 'Which banks have the most room to cut?'), get: s => s.maxBp, fmt: v => f1.format(v) + ' bp', asc: false, d: () => L('Mức giảm lớn nhất mà mỗi ngân hàng vẫn giữ được mục tiêu lợi nhuận.', 'The largest cut each bank can make and still meet the profit target.') },
    cov: { t: () => L('Ai còn dày đệm trang trải dự phòng?', 'Who keeps the thickest provision buffer?'), get: s => s.cov1, fmt: v => times(v), asc: false, d: () => L('Lợi nhuận trước dự phòng sau khi giảm lãi gấp bao nhiêu lần chi phí dự phòng.', 'How many times pre-provision profit after the cut covers provisions.') },
    car: { t: () => L('CAR sau giảm lãi ở từng ngân hàng', 'CAR after the cut, by bank'), get: s => s.car1, fmt: v => pct(v, 2), asc: false, d: () => L('Vạch đỏ là mức tối thiểu 8%; dấu * là CAR ước tính.', 'The red line is the 8% minimum; * marks an estimated CAR.') },
  };
  const bindBanks = el => el.querySelectorAll('[data-bank]').forEach(n => {
    const go = () => { S.bank = n.dataset.bank; syncYear(); render(); };
    n.addEventListener('click', go); n.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); go(); } });
  });
  // ngưỡng để người xem biết thanh nào "có vấn đề": mỗi chỉ tiêu một mốc so sánh, kèm trạng thái đạt/không đạt
  function cmpRefs() {
    const lossMax = -(1 - S.q);
    return {
      pat: { refs: [{ v: lossMax, c: 'var(--crit)', label: L(`Mất ${pct(1 - S.q, 0)} (mục tiêu)`, `${pct(1 - S.q, 0)} loss (target)`) }],
             status: v => v < lossMax ? 'crit' : 'ok' },
      max: { refs: [{ v: S.bp, c: 'var(--accent)', label: L(`Mức đang xét ${f0.format(S.bp)} bp`, `Cut under review ${f0.format(S.bp)} bp`) }],
             status: v => v < S.bp ? 'crit' : 'ok' },
      cov: { refs: [{ v: 1, c: 'var(--crit)', label: L('1 lần', '1×') }, { v: 2, c: 'var(--warn)', label: L('2 lần', '2×') }],
             status: v => v < 1 ? 'crit' : v < 2 ? 'warn' : 'ok' },
      car: { refs: [{ v: CAR_MIN, c: 'var(--crit)', label: L('Tối thiểu 8%', '8% minimum') }],
             status: v => v < CAR_MIN ? 'crit' : 'ok' },
    }[S.cmp];
  }
  // câu kết luận phía trên biểu đồ: bao nhiêu ngân hàng đạt ngưỡng, và ngân hàng đang chọn đứng ở đâu so với trung vị
  function cmpTakeaway(items, thin, med) {
    const n = items.length + thin.length, sel = items.find(i => i.b === S.bank);
    const bad = items.filter(i => cmpRefs().status(i.v) === 'crit').length + thin.length;
    const bp = f0.format(S.bp), q = f0.format(S.q * 100);
    const head = {
      pat: L(`${n - bad}/${n} ngân hàng vẫn giữ được ${q}% lợi nhuận khi giảm ${bp} bp.`, `${n - bad} of ${n} banks still keep ${q}% of profit at a ${bp} bp cut.`),
      max: L(`${n - bad}/${n} ngân hàng giảm được ${bp} bp mà vẫn đạt mục tiêu lợi nhuận.`, `${n - bad} of ${n} banks can cut ${bp} bp and still meet the profit target.`),
      cov: (() => { const c1 = items.filter(i => i.v < 1).length, c2 = items.filter(i => i.v >= 1 && i.v < 2).length;
        return c1 || c2 ? L(`${c1} ngân hàng không đủ trang trải dự phòng và ${c2} ngân hàng mỏng (1–2 lần) khi giảm ${bp} bp.`, `At ${bp} bp, ${c1} banks cannot cover provisions and ${c2} are thin (1–2×).`)
                        : L(`Cả ${n} ngân hàng vẫn trang trải dự phòng trên 2 lần khi giảm ${bp} bp.`, `All ${n} banks still cover provisions more than 2× at ${bp} bp.`); })(),
      car: bad ? L(`${bad}/${n} ngân hàng có CAR dưới 8% sau khi giảm ${bp} bp.`, `${bad} of ${n} banks fall below the 8% CAR minimum at ${bp} bp.`)
               : L(`Cả ${n} ngân hàng có số liệu vẫn giữ CAR trên 8% khi giảm ${bp} bp.`, `All ${n} banks with data stay above the 8% CAR minimum at ${bp} bp.`),
    }[S.cmp];
    if (!sel || med == null) return head;
    // lý do: độ nhạy lợi nhuận tỉ lệ nghịch với ROA, nên so ROA của ngân hàng đang chọn với trung vị
    const roa = b => { const r = row(b, S.year); return r && r.ta ? r.pat / r.ta : null; };
    const roaMed = median(items.map(i => roa(i.b))), roaSel = roa(S.bank);
    // cả bốn chỉ tiêu đều "cao hơn là tốt hơn"; riêng CAR chỉ so mức nên nói cao/thấp, không nói tốt/kém
    const better = sel.v > med;
    const cmp = S.cmp === 'car' ? L(better ? 'cao hơn' : 'thấp hơn', better ? 'above' : 'below') : L(better ? 'tốt hơn' : 'kém hơn', better ? 'better than' : 'worse than');
    let why = '';
    if ((S.cmp === 'pat' || S.cmp === 'max') && ok(roaSel) && ok(roaMed) && (roaSel > roaMed) === better)
      why = L(`, phù hợp với ROA ${roaSel > roaMed ? 'cao' : 'thấp'} hơn mặt bằng (${pct(roaSel, 2)} so với ${pct(roaMed, 2)})`,
              `, in line with its ${roaSel > roaMed ? 'higher' : 'lower'} ROA (${pct(roaSel, 2)} vs ${pct(roaMed, 2)})`);
    return head + ' ' + L(`${S.bank} ở mức ${cmpFmt(sel.v)}, ${cmp} trung vị ${cmpFmt(med)}${why}.`, `${S.bank} is at ${cmpFmt(sel.v)}, ${cmp} the median of ${cmpFmt(med)}${why}.`);
  }
  const cmpFmt = v => CMP[S.cmp].fmt(v);

  function drawCmp() {
    const cfg = CMP[S.cmp], R = cmpRefs(), el = $('chart-cmp'), items = [], skip = [], thin = [];
    banks.forEach(b => {
      const r = row(b, S.year);
      if (!r || r.loans == null || r.pat == null) { skip.push(b); return; }
      const s = sim(r, S.bp), v = cfg.get(s);
      if (!ok(v)) { skip.push(b + (r.pat <= 0 ? L(' (lỗ)', ' (loss)') : '')); return; }
      // lãi quá mỏng: mất hơn 100% LNST, % không còn ý nghĩa so sánh nên tách khỏi biểu đồ
      if (S.cmp === 'pat' && v < -1) { thin.push(`${b} ${sPct(v, 0)}`); return; }
      items.push({ b, v, s, est: S.cmp === 'car' && s.cap && s.cap.est });
    });
    items.sort((a, c) => cfg.asc ? a.v - c.v : c.v - a.v);
    const med = median(items.map(i => i.v));
    $('cmp-title').textContent = cfg.t();
    $('cmp-desc').textContent = `${cfg.d()} ${L('Năm', 'Year')} ${S.year}, ${f0.format(S.bp)} bp.` + (skip.length ? L(` Thiếu số liệu: ${skip.join(', ')}.`, ` No data: ${skip.join(', ')}.`) : '');
    const rh = 22, m = { t: 26, r: 64, b: 4, l: 92 }, w = W(el), h = m.t + m.b + items.length * rh;
    const sv = items.map(i => i.v).sort((a, c) => a - c), qt = p => sv[Math.floor(p * (sv.length - 1))] ?? 0;
    const refV = R.refs.map(r => r.v);
    const span = Math.max(Math.abs(qt(0.1)), Math.abs(qt(0.9)), ...refV.map(Math.abs)) * 1.6 || 1;
    const lo = Math.max(Math.min(0, ...sv, ...refV), -span), hi = Math.min(Math.max(0, ...sv, ...refV.map(v => v * 1.1)), span);
    const cl = v => Math.max(lo, Math.min(hi, v)), x = v => m.l + (cl(v) - lo) / ((hi - lo) || 1) * (w - m.l - m.r);
    const fill = { crit: 'color-mix(in srgb, var(--crit) 45%, var(--card))', warn: 'color-mix(in srgb, var(--warn) 45%, var(--card))', ok: 'var(--other)' };
    let g = gradDefs('cg') + `<line x1="${x(0)}" x2="${x(0)}" y1="${m.t - 4}" y2="${h}" stroke="var(--line-2)"/>`;
    // vạch ngưỡng và trung vị (vẽ trước để nằm dưới thanh và chữ số); nhãn của vạch nằm bên trái thì neo bên trái, để hai nhãn gần nhau không đè lên nhau
    const marks = [...R.refs.map(r => ({ ...r, dash: '5 3', w: 1.5 })), ...(med != null ? [{ v: med, c: 'var(--ink-2)', label: L('Trung vị', 'Median'), dash: '2 3', w: 1.2 }] : [])]
      .filter(k => k.v >= lo && k.v <= hi).sort((a, b) => a.v - b.v);
    marks.forEach((k, i) => {
      const xx = x(k.v), left = marks.length > 1 && i === 0;
      g += `<line x1="${xx}" x2="${xx}" y1="${m.t - 6}" y2="${h}" stroke="${k.c}" stroke-width="${k.w}" stroke-dasharray="${k.dash}"/>
        <text class="t-tick" x="${xx + (left ? -4 : 4)}" y="${m.t - 10}" text-anchor="${left ? 'end' : 'start'}" style="fill:${k.c}">${k.label}</text>`;
    });
    items.forEach((it, i) => {
      const yy = m.t + i * rh, sel = it.b === S.bank, x1 = x(Math.min(0, it.v)), x2 = x(Math.max(0, it.v)), clip = it.v < lo || it.v > hi;
      const st = R.status(it.v);
      const tt = `<b>${it.b} · ${S.year}</b><br>${cfg.t().replace('?', '')}: <b>${cfg.fmt(it.v)}</b>${it.est ? L(' (ước tính)', ' (estimated)') : ''}<br>${L('Người vay tiết kiệm', 'Borrowers save')} ${ty(it.s.save)} ${BN()}<br>${L('LNST', 'PAT')} ${ty(row(it.b, S.year).pat)} → ${ty(it.s.pat1)} ${BN()}`;
      g += `<g data-tip="${esc(tt)}" data-bank="${it.b}" tabindex="0" role="button" aria-label="${it.b}" style="cursor:pointer">
        <rect x="0" y="${yy}" width="${w}" height="${rh}" fill="${sel ? 'var(--accent-soft)' : 'transparent'}" rx="6"/>
        <text class="${sel ? 't-strong' : 't-lbl'}" x="${m.l - 10}" y="${yy + 15}" text-anchor="end">${it.b}${it.est ? '*' : ''}</text>
        <rect x="${x1}" y="${yy + 5}" width="${Math.max(2, x2 - x1)}" height="${rh - 10}" rx="4" fill="${sel ? 'url(#cgh)' : fill[st]}"/>
        ${clip ? `<text class="t-strong" x="${it.v < lo ? x1 + 6 : x2 - 6}" y="${yy + 15}" text-anchor="${it.v < lo ? 'start' : 'end'}">${it.v < lo ? '◂ ' : ''}${cfg.fmt(it.v)}${L(', vượt thang', ', off scale')}${it.v > hi ? ' ▸' : ''}</text>`
               : it.v < 0 && x1 - m.l < 56   // thanh âm chạm sát cột tên: ghi số vào trong thanh để không đè tên ngân hàng
                 ? `<text class="t-strong" x="${x1 + 6}" y="${yy + 15}" text-anchor="start">${cfg.fmt(it.v)}</text>`
                 : `<text class="${sel ? 't-strong' : 't-tick'}" x="${it.v < 0 ? x1 - 6 : x2 + 6}" y="${yy + 15}" text-anchor="${it.v < 0 ? 'end' : 'start'}">${cfg.fmt(it.v)}</text>`}</g>`;
    });
    const legend = `<div class="legend"><span><i style="background:var(--other)"></i>${L('Đạt ngưỡng', 'Meets threshold')}</span>` +
      (S.cmp === 'cov' ? `<span><i style="background:${fill.warn}"></i>${L('Mỏng', 'Thin')}</span>` : '') +
      `<span><i style="background:${fill.crit}"></i>${L('Không đạt', 'Fails')}</span><span><i style="background:var(--accent)"></i>${L('Ngân hàng đang chọn', 'Selected bank')}</span></div>`;
    el.innerHTML = `<p class="cmp-take">${esc(cmpTakeaway(items, thin, med))}</p>
      <svg viewBox="0 0 ${w} ${h}" role="img" aria-label="${esc(cfg.t())}">${g}</svg>${legend}` +
      (thin.length ? `<p class="desc" style="margin-top:8px">${L(`Không vẽ vì lãi quá mỏng, mất hơn toàn bộ lợi nhuận: ${thin.join(', ')}.`, `Not drawn because profit is too thin (it loses more than all of it): ${thin.join(', ')}.`)}</p>` : '') +
      `<p class="desc" style="margin-top:8px">${L('Bấm vào một ngân hàng để xem chi tiết.', 'Click a bank for details.')}</p>`;
    bindBanks(el);
  }

  function drawScen(r) {
    $('scen-title').textContent = L('Các mức giảm thường được cân nhắc', 'Commonly considered cuts');
    const sc = scen(S.macro);
    $('scen-desc').textContent = L(`Giữ nguyên các giả định ở trên${sc ? ` và kịch bản ${scLabel(sc).toLowerCase()}` : ''}, chỉ thay mức giảm.`,
                                   `Same assumptions as above${sc ? ` and the ${scLabel(sc).toLowerCase()} scenario` : ''}; only the cut changes.`);
    const list = [...new Set([0, 10, 25, 50, 100, S.bp])].sort((a, c) => a - c);
    $('tbl-scen').innerHTML = `<thead><tr><th>${L('Mức giảm', 'Cut')}</th><th>${L('Người vay tiết kiệm', 'Borrower savings')}</th><th>${L('LNST mới', 'New PAT')}</th><th>${L('Δ LNST', 'Δ PAT')}</th><th>${L('Trang trải DP', 'Coverage')}</th><th>CAR</th></tr></thead><tbody>` +
      list.map(b => { const s = sim(r, b);
        return `<tr class="${b === S.bp ? 'current' : ''}"><td>${f0.format(b)} bp</td><td>${ty(s.save)}</td><td>${ty(s.pat1)}</td><td>${s.patChg == null ? '–' : sPct(s.patChg)}</td>
          <td>${times(s.cov1)}</td><td>${s.cap ? pct(s.car1, 2) : '–'}</td></tr>`; }).join('') +
      `</tbody>`;
  }

  // ma trận kịch bản: hàng = kịch bản vĩ mô, cột = mức giảm; bấm ô để chọn cả hai
  function drawMatrix(r) {
    const cols = [...new Set([0, 25, 50, S.bp])].sort((a, c) => a - c);
    $('mx-desc').textContent = L(`Mỗi ô là phần lợi nhuận giữ lại (✓ là đạt mục tiêu), kèm CAR và khả năng trang trải dự phòng. Bấm vào ô để chọn tổ hợp đó.`,
                                 `Each cell shows the profit kept (✓ meets the target), with CAR and provision coverage. Click a cell to select it.`);
    const mark = s => s.retain == null ? '' : s.retain >= S.q ? '✓ ' : '! ';
    $('tbl-matrix').innerHTML = `<thead><tr><th>${L('Kịch bản vĩ mô', 'Macro scenario')}</th>${cols.map(b => `<th style="text-align:center">${f0.format(b)} bp</th>`).join('')}</tr></thead><tbody>` +
      ECON.scenarios.map(sc => `<tr><td><b>${esc(scLabel(sc))}</b><div class="m2" style="color:var(--muted);font-size:11.5px">${sc.dllp ? L(`Chi phí DP ${sNum(sc.dllp * 1e4)} bp dư nợ`, `Provisions ${sNum(sc.dllp * 1e4)} bp of loans`) : L('Như năm nền', 'As base year')}</div></td>` +
        cols.map(b => { const s = sim(r, b, { ...S, macro: sc.id }), on = b === S.bp && sc.id === S.macro;
          const tt = L(`<b>${scLabel(sc)} · ${f0.format(b)} bp</b><br>LNST ${ty(r.pat)} → ${ty(s.pat1)} tỷ<br>Trong đó do giảm lãi −${ty(s.dPAT)}, do vĩ mô ${sTy(-s.dProvAT)}<br>CAR ${s.cap ? pct(s.car1, 2) : '–'} · Trang trải DP ${times(s.cov1)}`,
                       `<b>${scLabel(sc)} · ${f0.format(b)} bp</b><br>PAT ${ty(r.pat)} → ${ty(s.pat1)} bn<br>From the cut −${ty(s.dPAT)}, from macro ${sTy(-s.dProvAT)}<br>CAR ${s.cap ? pct(s.car1, 2) : '–'} · Coverage ${times(s.cov1)}`);
          return `<td class="${on ? 'sel' : ''}" data-bp="${b}" data-macro="${sc.id}" tabindex="0" data-tip="${esc(tt)}">
            <div class="m1">${mark(s)}${s.retain == null ? ty(s.pat1) + ' ' + BN() : pct(s.retain)}</div>
            <div class="m2">CAR ${s.cap ? pct(s.car1, 1) : '–'} · ${L('DP', 'Cov')} ${times(s.cov1)}</div></td>`; }).join('') + '</tr>').join('') + '</tbody>';
  }
  function drawMacroRow() {
    const has = ECON.scenarios.length > 0;
    $('macro-row').hidden = !has;
    if (!has) return;
    $('macro-seg').innerHTML = $('macro-seg2').innerHTML = ECON.scenarios.map(sc => `<button data-macro="${sc.id}" aria-pressed="${sc.id === S.macro}">${esc(scLabel(sc))}</button>`).join('');
    const sc = ECON.scenarios.find(x => x.id === S.macro);
    $('macro-hint').textContent = !sc ? '' : !sc.dllp ? `${LX(sc, 'desc')}.`
      : LX(sc, 'desc') + L(`, chi phí dự phòng ${sc.dllp > 0 ? 'tăng' : 'giảm'} ${f1.format(Math.abs(sc.dllp * 1e4))} bp trên dư nợ.`,
                           `; provisions ${sc.dllp > 0 ? 'rise' : 'fall'} by ${f1.format(Math.abs(sc.dllp * 1e4))} bp of loans.`);
  }

  // ================== PHƯƠNG PHÁP ==================
  const lineageRows = r => [[L('Cho vay khách hàng (gộp)', 'Customer loans (gross)'), r.loans, 'BCĐKT · Cho vay khách hàng'], [L('Thu nhập lãi', 'Interest income'), r.ii, 'KQKD · Thu nhập lãi và các khoản tương tự'],
      [L('Chi phí lãi', 'Interest expense'), r.ie, 'KQKD · Chi phí lãi và các chi phí tương tự'], [L('Thu nhập lãi thuần', 'Net interest income'), r.nii, 'KQKD · Thu nhập lãi thuần'],
      [L('LN trước chi phí dự phòng', 'Pre-provision profit'), r.ppop, 'KQKD · LN thuần trước CF dự phòng rủi ro tín dụng'], [L('Chi phí dự phòng rủi ro tín dụng', 'Credit-loss provisions'), r.prov, 'KQKD · Chi phí dự phòng rủi ro tín dụng'],
      [L('LN trước thuế', 'Profit before tax'), r.pbt, 'KQKD · Tổng lợi nhuận trước thuế'], [L('LN sau thuế', 'Profit after tax'), r.pat, 'KQKD · Lợi nhuận sau thuế'], [L('Tổng tài sản', 'Total assets'), r.ta, 'BCĐKT · Tổng tài sản'],
      [L('Vốn chủ sở hữu', 'Equity'), r.equity, 'BCĐKT · Vốn chủ sở hữu'], [L('Vốn tự có', 'Regulatory capital'), r.vtc, 'Báo cáo an toàn vốn · Vốn tự có'],
      [L('Tổng tài sản có rủi ro (RWA)', 'Risk-weighted assets (RWA)'), r.rwa, 'Báo cáo an toàn vốn · Tổng tài sản có rủi ro'], [L('CAR công bố', 'Reported CAR'), r.car_rep, 'Thuyết minh · CAR', 1], [L('Tỷ lệ nợ xấu (nhóm 3–5)', 'NPL ratio (groups 3–5)'), r.npl, 'Thuyết minh · Phân loại nợ', 1]];
  const cellVal = (v, p) => v == null ? `<span style="color:var(--muted)">${L('thiếu', 'missing')}</span>` : p ? pct(v, 2) : ty(v);
  const srcHead = () => L('Sheet · dòng nguồn', 'Source sheet · line (Vietnamese)');

  // các phép kiểm tra chất lượng dữ liệu cho một ngân hàng-năm; dùng chung cho chế độ một năm và tất cả các năm
  function flagsFor(r, s) {
    const F = [], add = (good, t) => F.push({ good, t });
    const g1 = Math.abs(r.ppop - r.prov - r.pbt); add(g1 < 1, L(`LN trước DP − Chi phí DP = LNTT (lệch ${f2.format(g1)} tỷ)`, `Pre-provision profit − provisions = PBT (gap ${f2.format(g1)} bn)`));
    const g2 = Math.abs(r.pbt - r.tax - r.pat); add(g2 < 1, L(`LNTT − Thuế = LNST (lệch ${f2.format(g2)} tỷ)`, `PBT − tax = PAT (gap ${f2.format(g2)} bn)`));
    if (r.pbt > 0) { const e = r.tax / r.pbt; add(Math.abs(e - S.tax) < 0.03, L(`Thuế suất hiệu dụng năm nền ${pct(e)}, giả định ${pct(S.tax)}`, `Effective tax rate ${pct(e)}, assumed ${pct(S.tax)}`)); }
    s.cap ? add(!s.cap.est, s.cap.note) : add(false, L('Không có dữ liệu vốn để tính CAR', 'No capital data to compute CAR'));
    if (r.pat <= 0) add(false, L('LNST năm nền ≤ 0: % thay đổi và mức giảm tối đa không có ý nghĩa', 'Base-year PAT ≤ 0: % change and max cut are not meaningful'));
    if (r.npl != null) add(r.npl < 0.03, L(`Nợ xấu ${pct(r.npl, 2)} dư nợ${r.npl >= 0.03 ? ', trên 3%: đệm dự phòng nên đọc thận trọng' : ''}`, `NPL ${pct(r.npl, 2)} of loans${r.npl >= 0.03 ? ', above 3%: read the provision buffer with care' : ''}`));
    return F;
  }

  function drawMethod(r, s) {
    $('lin-title').textContent = `${L('Số liệu nền', 'Source data')} · ${r.bank} ${r.year}`;
    $('lin-desc').textContent = `${L('Đơn vị tỷ VND', 'VND bn')}. ${LX(META, 'source')}.`;
    $('tbl-lineage').innerHTML = `<thead><tr><th>${L('Chỉ tiêu', 'Item')}</th><th>${L('Giá trị', 'Value')}</th><th style="text-align:left">${srcHead()}</th></tr></thead><tbody>` +
      lineageRows(r).map(([n, v, src, p]) => `<tr><td>${n}</td><td>${cellVal(v, p)}</td><td class="src">${src}</td></tr>`).join('') + '</tbody>';
    $('flags').innerHTML = flagsFor(r, s).map(f => `<li class="${f.good ? '' : 'w'}">${f.t}</li>`).join('');
    drawFormulas();
  }
  function drawFormulas() {
    $('formulas').innerHTML = [
      [L('Dư nợ hiệu lực', 'Effective loans'), L('E = Dư nợ cho vay × α × (số tháng / 12)', 'E = loans × α × (months / 12)')], [L('Người vay tiết kiệm', 'Borrower savings'), L('T = E × s / 10.000', 'T = E × s / 10,000')],
      [L('Người gửi tiền gánh', 'Borne by depositors'), L('φ × T (φ = bù chi phí vốn)', 'φ × T (φ = funding cost offset)')], [L('LNTT giảm', 'Fall in PBT'), 'T × (1 − φ)'], [L('Ngân sách gánh', 'Borne by the budget'), L('T × (1 − φ) × thuế suất', 'T × (1 − φ) × tax rate')],
      [L('LNST giảm', 'Fall in PAT'), L('T × (1 − φ) × (1 − thuế suất) + ΔDP vĩ mô × (1 − thuế suất)', 'T × (1 − φ) × (1 − tax) + macro Δprovisions × (1 − tax)')],
      [L('ΔDP vĩ mô', 'Macro Δprovisions'), L('Δ(chi phí DP / dư nợ) theo kịch bản × dư nợ', 'scenario Δ(provisions / loans) × loans')],
      [L('Trang trải dự phòng', 'Provision coverage'), L('(LN trước DP − LNTT giảm) / (Chi phí DP nền + ΔDP vĩ mô)', '(pre-provision profit − fall in PBT) / (base provisions + macro Δprovisions)')],
      [L('CAR mới', 'New CAR'), L('CAR nền − LNST giảm × k / RWA', 'base CAR − fall in PAT × k / RWA')], [L('Mức giảm tối đa', 'Maximum cut'), L('[(1 − mục tiêu) × LNST nền − ΔDP vĩ mô × (1 − thuế)] / [E × (1 − φ) × (1 − thuế)] × 10.000', '[(1 − target) × base PAT − macro Δprovisions × (1 − tax)] / [E × (1 − φ) × (1 − tax)] × 10,000')],
      [L('Điểm hòa vốn', 'Break-even cut'), L('(LNTT nền − ΔDP vĩ mô) / [E × (1 − φ)] × 10.000', '(base PBT − macro Δprovisions) / [E × (1 − φ)] × 10,000')]].map(([a, b]) => `<dt>${a}</dt><dd>${b}</dd>`).join('');
  }
  function drawLimits() {
    $('limits').innerHTML = [
      L('Kết quả là tác động tăng thêm trong 12 tháng so với năm nền, không phải dự báo LNST năm sau. Dư nợ, chi phí hoạt động và các nguồn thu khác giữ nguyên.',
        'Results are the incremental 12-month effect versus the base year, not a profit forecast. Loans, operating costs and other income are held constant.'),
      L('Dữ liệu tổng hợp không có bảng kỳ định lại lãi, nên thời điểm đổi lãi được nhập bằng số tháng hiệu lực bình quân. Mặc định 12 tháng là cận trên; vì vậy số tiết kiệm của VCB ở 25 bp (khoảng 4.200 tỷ) cao hơn ước tính trong đề xuất ALCO (2.666 tỷ), vốn tính theo lộ trình định lại.',
        'The data has no repricing-gap table, so timing is set by average months in effect. The 12-month default is an upper bound, which is why VCB\'s savings at 25 bp (about VND 4,200 bn) exceed the ALCO proposal\'s VND 2,666 bn, which follows the repricing schedule.'),
      L(`"Chi phí vốn giảm theo" mặc định ${pct(PHI_DATA, 0)}: hệ số truyền dẫn khi riêng một ngân hàng đổi lãi (hồi quy panel có hiệu ứng cố định năm). Đây là tương quan lịch sử, không phải cam kết; 0% là kịch bản xấu nhất.`,
        `"Funding cost offset" defaults to ${pct(PHI_DATA, 0)}: the pass-through when one bank moves alone (panel regression with year fixed effects). A historical correlation, not a guarantee; 0% is the worst case.`),
      L('Tác động là tuyến tính theo mức giảm: mỗi bp làm mất cùng một khoản lợi nhuận. Thực tế có thể cong, vì phần bù chi phí vốn có thể đổi theo mức giảm và lãi thấp hơn giúp người vay trả nợ tốt hơn; dữ liệu năm không đủ để ước lượng độ cong này. Dải mờ trên biểu đồ thể hiện độ bất định của phần bù chi phí vốn.',
        'The impact is linear in the cut: every bp costs the same amount of profit. In reality it may curve, since the funding offset can change with the size of the cut and lower rates help borrowers repay; annual data cannot estimate this curvature. The shaded band on the chart shows the uncertainty in the funding offset.'),
      L('Mô phỏng giả định mỗi bp NIM mất làm ROA mất 0,8 bp; mô hình panel cho thấy ngân hàng thường bù được một phần, nên thiệt hại LNST là cận trên.',
        'The simulator assumes each bp of lost NIM costs 0.8 bp of ROA; the panel model shows banks usually recover part of it, so the profit hit is an upper bound.'),
      L('Dư nợ là số dư cuối năm nền, gộp trước dự phòng. NIM tính trên tổng tài sản, nên chỉ là đại diện cho NIM trên tài sản sinh lãi.',
        'Loans are gross year-end balances. NIM uses total assets, a proxy for NIM on earning assets.'),
      L('Kịch bản vĩ mô chỉ đi qua kênh chi phí dự phòng: tỷ lệ chi phí dự phòng/dư nợ đổi theo hệ số GDP của mô hình panel, cú sốc lấy từ chênh lệch giữa hai năm thật. Hệ số chỉ có ý nghĩa với sai số Driscoll-Kraay, không có ý nghĩa với sai số cụm theo ngân hàng, và chỉ dựa trên khoảng 10 năm. Kịch bản không đổi NIM (tránh tính trùng) và không đổi RWA.',
        'Macro scenarios act only through provisions: provisions/loans move with the panel model\'s GDP coefficient, shocks taken from the gap between two actual years. The coefficient is significant with Driscoll-Kraay SE but not with bank-clustered SE, and rests on ~10 years. Scenarios do not change NIM (no double counting) or RWA.'),
      L('CAR chỉ thay đổi qua vốn tự có (lợi nhuận giữ lại), RWA giữ nguyên. Khi thiếu vốn tự có/RWA hoặc RWA không khớp CAR công bố, RWA được suy ra từ CAR công bố và có nhãn "ước tính".',
        'CAR moves only through capital (retained profit); RWA is held constant. Where capital/RWA is missing or inconsistent with reported CAR, RWA is implied from reported CAR and labelled "estimated".'),
    ].map(t => `<li class="w">${t}</li>`).join('');
  }
  function drawGlossary() {
    $('glossary').innerHTML = Object.keys(TERMS).map(k => `<dt>${TERMS[k][S.lang === 'en' ? 1 : 0]}</dt><dd>${esc(termTip(k))}</dd>`).join('');
  }

  // ================== TẤT CẢ CÁC NĂM ==================
  const median = a => { const v = a.filter(ok).sort((x, y) => x - y); return v.length ? v[Math.floor((v.length - 1) / 2)] : null; };
  const argBy = (ys, vals, cmp) => { let bi = -1; vals.forEach((v, i) => { if (ok(v) && (bi < 0 || cmp(v, vals[bi]))) bi = i; }); return bi < 0 ? null : { y: ys[bi], v: vals[bi] }; };

  // biểu đồ cột nhỏ theo năm; năm gần nhất tô đậm, ô thiếu ghi "–"
  function spark(vals, ys, fmt, o = {}) {
    const w = 300, h = 66, m = { t: 6, b: 16, l: 2, r: 2 }, n = vals.length, nums = vals.filter(ok);
    if (!nums.length) return '';
    let lo = Math.min(0, ...nums, o.ref ?? 0), hi = Math.max(0, ...nums, o.ref ?? 0);
    if (o.clip) { lo = Math.max(lo, o.clip[0]); hi = Math.min(hi, o.clip[1]); }
    const y = v => m.t + (1 - (Math.max(lo, Math.min(hi, v)) - lo) / ((hi - lo) || 1)) * (h - m.t - m.b);
    const bw = (w - m.l - m.r) / n, ink = o.ink || 'var(--muted)', col = o.color || 'var(--accent)';
    let g = `<line x1="${m.l}" x2="${w - m.r}" y1="${y(0)}" y2="${y(0)}" stroke="${ink}" stroke-opacity=".5"/>`;
    if (o.ref != null) g += `<line x1="${m.l}" x2="${w - m.r}" y1="${y(o.ref)}" y2="${y(o.ref)}" stroke="var(--crit)" stroke-dasharray="3 3"/>`;
    vals.forEach((v, i) => {
      const x = m.l + i * bw, last = i === n - 1;
      if (ok(v)) {
        const a = y(Math.max(0, v)), b = y(Math.min(0, v)), bad = o.ref != null && v < o.ref;
        g += `<rect x="${x + bw * 0.16}" y="${a}" width="${bw * 0.68}" height="${Math.max(1.5, b - a)}" rx="2" fill="${bad ? 'var(--crit)' : col}" fill-opacity="${last ? 1 : 0.5}"/>`;
      } else g += `<text x="${x + bw / 2}" y="${y(0) - 3}" text-anchor="middle" style="font-size:10px;fill:${ink}">–</text>`;
      g += `<text x="${x + bw / 2}" y="${h - 3}" text-anchor="middle" style="font-size:9.5px;fill:${ink};font-weight:${last ? 700 : 400}">'${String(ys[i]).slice(2)}</text>`;
      g += `<rect x="${x}" y="0" width="${bw}" height="${h}" fill="transparent" data-tip="${esc(`<b>${ys[i]}</b><br>${ok(v) ? fmt(v) : L('Không tính được', 'Not computable')}`)}"/>`;
    });
    return `<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:auto;display:block;margin-top:12px" role="img" aria-label="${esc(o.aria || L('Giá trị theo năm', 'Values by year'))}">${g}</svg>`;
  }

  function drawHeadAll(ys, R, X) {
    const mx = X.map(s => s.maxBp).filter(ok), prof = X.filter(s => s.retain != null), hit = prof.filter(s => s.retain >= S.q).length;
    const sv = X.map(s => s.save), yl = ys[ys.length - 1], q = f0.format(S.q * 100);
    const a = mx.length ? f0.format(Math.floor(Math.min(...mx))) : '', b = mx.length ? f0.format(Math.floor(Math.max(...mx))) : '';
    $('title').textContent = mx.length
      ? L(`${S.bank} ${ys[0]}–${yl}: giảm tối đa từ ${a} đến ${b} bp tùy năm mà vẫn giữ ${q}% lợi nhuận`, `${S.bank} ${ys[0]}–${yl}: maximum cut of ${a}–${b} bp depending on the year, keeping ${q}% of profit`)
      : L(`${S.bank} ${ys[0]}–${yl}: không có năm nào có lãi để tính mức giảm tối đa`, `${S.bank} ${ys[0]}–${yl}: no profitable year to compute a maximum cut`);
    $('subtitle').textContent = L(`Ở ${f0.format(S.bp)} bp, người vay tiết kiệm ${ty(Math.min(...sv))}–${ty(Math.max(...sv))} tỷ đồng mỗi năm; mức giảm này đạt mục tiêu LNST ở ${hit}/${prof.length} năm có lãi. Mỗi năm được mô phỏng độc lập trên báo cáo tài chính hợp nhất của năm đó.`,
                                  `At ${f0.format(S.bp)} bp, borrowers save VND ${ty(Math.min(...sv))}–${ty(Math.max(...sv))} bn a year; this cut meets the profit target in ${hit}/${prof.length} profitable years. Each year is simulated on its own consolidated statements.`);
  }

  function drawKpisAll(ys, R, X) {
    const n = ys.length, yl = ys[n - 1], Lt = X[n - 1];
    const save = X.map(s => s.save), lo = argBy(ys, save, (a, b) => a < b), hi = argBy(ys, save, (a, b) => a > b);
    $('kpi-save').innerHTML = `
      <div class="k-top"><span class="k-label">${L('Người vay tiết kiệm', 'Borrower savings')}</span><span class="tag num">${ys[0]}–${yl}</span></div>
      <div class="k-value">${ty(Lt.save)} <small>${BNL()} ${L('năm', 'in')} ${yl}</small></div>
      <div class="k-sub">${L(`Từ ${ty(lo.v)} tỷ (${lo.y}) đến ${ty(hi.v)} tỷ (${hi.y}) mỗi năm. Cộng ${n} năm: <b style="color:#fff">${ty(save.reduce((a, b) => a + b, 0))}</b> tỷ`,
                                 `From ${ty(lo.v)} bn (${lo.y}) to ${ty(hi.v)} bn (${hi.y}) a year. Sum of ${n} years: <b style="color:#fff">${ty(save.reduce((a, b) => a + b, 0))}</b> bn`)}</div>
      ${spark(save, ys, v => ty(v) + ' ' + BNL(), { color: '#ffffff', ink: 'rgba(255,255,255,.75)' })}
      <div class="k-foot">${fx(L('<b>Tiết kiệm = Dư nợ cuối năm × α × số tháng/12 × s</b><br>Tính riêng cho từng năm trên dư nợ của năm đó', '<b>Savings = year-end loans × α × months/12 × s</b><br>Computed for each year on that year\'s loans'))}</div>`;

    const pc = X.map(s => s.patChg), prof = X.filter(s => s.retain != null), hit = prof.filter(s => s.retain >= S.q).length;
    const worst = argBy(ys, pc, (a, b) => a < b), hitTxt = L(`Đạt mục tiêu ${hit}/${prof.length} năm`, `Meets target ${hit}/${prof.length} yrs`);
    $('kpi-pat').innerHTML = `
      <div class="k-top"><span class="k-label">${term('pat')}</span>${hit === prof.length ? badge('good', '✓', hitTxt) : badge(hit ? 'warn' : 'crit', '!', hitTxt)}</div>
      <div class="k-value">${ok(Lt.patChg) ? sPct(Lt.patChg) : '–'} <small>${L('năm', 'in')} ${yl}</small></div>
      <div class="k-sub">${L(`Trung vị các năm ${sPct(median(pc))}${worst ? `; nhạy nhất năm ${worst.y} (${sPct(worst.v)})` : ''}${prof.length < n ? `; ${n - prof.length} năm lỗ không tính %` : ''}`,
                             `Median across years ${sPct(median(pc))}${worst ? `; most sensitive in ${worst.y} (${sPct(worst.v)})` : ''}${prof.length < n ? `; ${n - prof.length} loss years excluded` : ''}`)}</div>
      ${spark(pc, ys, v => sPct(v), { clip: [-0.6, 0.05] })}
      <div class="k-foot">${fx(L('<b>% ΔLNST của từng năm</b><br>Cột bị cắt ở −60% để các năm còn lại đọc được; rê chuột để xem số thật', '<b>% ΔPAT for each year</b><br>Bars clipped at −60% so other years stay readable; hover for the true value'))}</div>`;

    const cv = X.map(s => s.cov1), b1 = cv.filter(v => ok(v) && v < 1).length, b2 = cv.filter(v => ok(v) && v < 2).length, cmin = argBy(ys, cv, (a, b) => a < b);
    $('kpi-cov').innerHTML = `
      <div class="k-top"><span class="k-label">${term('cov')}</span>${b1 ? badge('crit', '✕', L(`${b1} năm dưới 1 lần`, `${b1} yrs below 1×`)) : b2 ? badge('warn', '!', L(`${b2} năm mỏng`, `${b2} thin yrs`)) : badge('good', '✓', L('Dày mọi năm', 'Thick every year'))}</div>
      <div class="k-value">${times(Lt.cov1)} <small>${L('năm', 'in')} ${yl}</small></div>
      <div class="k-sub">${cmin ? L(`Thấp nhất ${times(cmin.v)} năm ${cmin.y}`, `Lowest ${times(cmin.v)} in ${cmin.y}`) : ''}. ${L('Vạch đỏ: 1 lần (vừa đủ trang trải)', 'Red line: 1× (just covered)')}</div>
      ${spark(cv, ys, times, { ref: 1 })}
      <div class="k-foot">${fx(L('<b>(LN trước DP − ΔLNTT) / Chi phí DP</b> của từng năm<br>≥ 2 lần dày, 1–2 lần mỏng, < 1 lần không đủ', '<b>(Pre-provision profit − ΔPBT) / provisions</b> for each year<br>≥ 2× thick, 1–2× thin, < 1× insufficient'))}</div>`;

    const cr = X.map(s => s.car1), avail = cr.filter(ok).length, b8 = cr.filter(v => ok(v) && v < CAR_MIN).length;
    const lastCar = [...cr.keys()].reverse().find(i => ok(cr[i])), crMin = argBy(ys, cr, (a, b) => a < b);
    $('kpi-car').innerHTML = `
      <div class="k-top"><span class="k-label">${term('car', 'CAR')}</span>${!avail ? badge('na', '–', L('Thiếu dữ liệu', 'No data')) : b8 ? badge('crit', '✕', L(`${b8} năm dưới 8%`, `${b8} yrs below 8%`)) : badge('good', '✓', L('Trên 8% mọi năm có số', 'Above 8% in all years with data'))}</div>
      <div class="k-value">${lastCar != null ? pct(cr[lastCar], 2) : '–'} <small>${lastCar != null ? L('năm ', 'in ') + ys[lastCar] : ''}</small></div>
      <div class="k-sub">${L(`${avail}/${n} năm có dữ liệu vốn`, `${avail}/${n} years with capital data`)}${crMin ? L(`; thấp nhất ${pct(crMin.v, 2)} năm ${crMin.y}`, `; lowest ${pct(crMin.v, 2)} in ${crMin.y}`) : ''}. ${L('Vạch đỏ: 8%', 'Red line: 8%')}</div>
      ${spark(cr, ys, v => pct(v, 2), { ref: CAR_MIN })}
      <div class="k-foot">${fx(L('<b>CAR mới = CAR nền − ΔLNST × k / RWA</b> của từng năm<br>Năm thiếu vốn tự có/RWA và CAR công bố thì để trống', '<b>New CAR = base CAR − ΔPAT × k / RWA</b> for each year<br>Blank where capital/RWA and reported CAR are missing'))}</div>`;
  }

  function drawSensAll(ys, R) {
    const el = $('chart-sens'), w = W(el), h = Math.round(Math.max(280, Math.min(380, w * 0.25))), m = { t: 20, r: 80, b: 40, l: 48 };
    $('sens-title').textContent = L('Mức giảm và phần lợi nhuận giữ lại, từng năm', 'Rate cut and profit kept, year by year');
    const V = ys.map((y, i) => ({ y, r: R[i] })).filter(o => o.r.pat > 0);
    if (!V.length) { el.innerHTML = `<p class="desc">${L('Không có năm nào LNST dương để tính.', 'No year with positive profit.')}</p>`; $('sens-desc').textContent = ''; return; }
    V.forEach(o => { o.s = sim(o.r, S.bp); });
    const last = V[V.length - 1], mx = V.map(o => o.s.maxBp).filter(ok);
    const xmax = Math.max(200, Math.ceil(S.bp * 1.4 / 50) * 50);
    const lowest = Math.min(...V.map(o => sim(o.r, xmax).retain));
    const yt = ticks(Math.max(-0.5, Math.min(0.5, lowest, S.q - 0.05)), 1, 5).filter(v => v <= 1 + 1e-9), y0 = yt[0];
    const x = v => m.l + v / xmax * (w - m.l - m.r), y = v => m.t + (1 - (v - y0) / (1 - y0)) * (h - m.t - m.b);
    const rng = mx.length ? ` (${f0.format(Math.floor(Math.min(...mx)))}–${f0.format(Math.floor(Math.max(...mx)))} bp)` : '';
    $('sens-desc').textContent = L(`${S.bank}: đường xanh là năm ${last.y}, đường xám là các năm khác. Chấm trên đường mục tiêu là mức giảm tối đa của từng năm${rng}. Rê chuột để xem từng năm, bấm để chọn mức giảm.`,
                                   `${S.bank}: blue is ${last.y}, grey lines are other years. Dots on the target line mark each year's maximum cut${rng}. Hover for each year; click to set the cut.`);
    let g = `<defs><clipPath id="sclip"><rect x="${m.l}" y="${m.t}" width="${w - m.l - m.r}" height="${h - m.t - m.b}"/></clipPath></defs>`;
    yt.forEach(v => g += `<line x1="${m.l}" x2="${w - m.r}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text class="t-tick" x="${m.l - 8}" y="${y(v) + 4}" text-anchor="end">${f0.format(v * 100)}%</text>`);
    ticks(0, xmax, 6).filter(v => v <= xmax).forEach(v => g += `<text class="t-tick" x="${x(v)}" y="${h - m.b + 18}" text-anchor="middle">${f0.format(v)}</text>`);
    g += `<text class="t-tick" x="${(m.l + w - m.r) / 2}" y="${h - 3}" text-anchor="middle">${L('Mức giảm lãi suất (bp)', 'Lending-rate cut (bp)')}</text>`;
    g += `<line x1="${x(Math.min(S.bp, xmax))}" x2="${x(Math.min(S.bp, xmax))}" y1="${m.t}" y2="${h - m.b}" stroke="var(--accent)" stroke-dasharray="3 4"/>
      <text class="t-strong" x="${x(Math.min(S.bp, xmax)) + 6}" y="${h - m.b - 8}">${f0.format(S.bp)} bp</text>`;
    const path = r => Array.from({ length: 101 }, (_, i) => { const b = xmax * i / 100; return (i ? 'L' : 'M') + x(b).toFixed(1) + ',' + y(sim(r, b).retain).toFixed(1); }).join('');
    g += `<g clip-path="url(#sclip)">` + V.filter(o => o !== last).map(o => `<path d="${path(o.r)}" fill="none" stroke="var(--other)" stroke-width="1.5"/>`).join('') +
      `<path d="${path(last.r)}" fill="none" stroke="var(--accent)" stroke-width="2.5"/></g>`;
    g += `<line x1="${m.l}" x2="${w - m.r}" y1="${y(S.q)}" y2="${y(S.q)}" stroke="var(--ink-2)" stroke-dasharray="5 5"/>
      <text class="t-lbl" x="${w - m.r + 6}" y="${y(S.q) + 4}">${L('Mục tiêu', 'Target')} ${f0.format(S.q * 100)}%</text>`;
    V.forEach(o => { if (ok(o.s.maxBp) && o.s.maxBp <= xmax) g += `<circle cx="${x(o.s.maxBp)}" cy="${y(S.q)}" r="${o === last ? 6 : 4.5}" fill="${o === last ? 'var(--accent)' : 'var(--card)'}" stroke="var(--accent)" stroke-width="2" data-tip="${esc(L(`<b>${o.y}</b><br>Giảm tối đa ${f1.format(o.s.maxBp)} bp vẫn giữ ${f0.format(S.q * 100)}% LNST`, `<b>${o.y}</b><br>Max cut ${f1.format(o.s.maxBp)} bp keeping ${f0.format(S.q * 100)}% of PAT`))}"/>`; });
    const le = sim(last.r, xmax).retain;
    if (le >= y0) g += `<text class="t-strong" x="${x(xmax) - 4}" y="${y(le) - 8}" text-anchor="end" style="fill:var(--accent)">${last.y}</text>`;
    g += `<line id="sx" y1="${m.t}" y2="${h - m.b}" stroke="var(--line-2)" visibility="hidden"/>
      <rect class="hit" x="${m.l}" y="${m.t}" width="${w - m.l - m.r}" height="${h - m.t - m.b}" fill="transparent" style="cursor:crosshair"/>`;
    el.innerHTML = `<svg viewBox="0 0 ${w} ${h}" role="img" aria-label="${L('LNST giữ lại theo mức giảm, mỗi đường một năm', 'Profit kept by cut, one line per year')}">${g}</svg>`;
    const svg = el.querySelector('svg'), hit = svg.querySelector('.hit'), sx = svg.querySelector('#sx');
    // chấm mức tối đa nằm dưới lớp bắt chuột; đưa lên trên để rê vào được
    svg.querySelectorAll('circle[data-tip]').forEach(c => svg.appendChild(c));
    let hb = null;
    hit.addEventListener('mousemove', ev => {
      const pt = svg.createSVGPoint(); pt.x = ev.clientX; pt.y = ev.clientY;
      hb = Math.max(0, Math.min(xmax, Math.round((pt.matrixTransform(svg.getScreenCTM().inverse()).x - m.l) / (w - m.l - m.r) * xmax)));
      sx.setAttribute('x1', x(hb)); sx.setAttribute('x2', x(hb)); sx.setAttribute('visibility', 'visible');
      const list = V.slice().reverse().map(o => { const q = sim(o.r, hb).retain; return `<span style="color:${q >= S.q ? 'var(--good)' : 'var(--ink-2)'}">${o.y}: ${pct(q)}</span>`; }).join('<br>');
      showTip(`<b>${f0.format(hb)} bp</b> · ${L('LNST giữ lại', 'PAT kept')}<br>${list}`, ev);
    });
    hit.addEventListener('mouseleave', () => { sx.setAttribute('visibility', 'hidden'); hideTip(); });
    hit.addEventListener('click', () => { if (hb != null) { hideTip(); setBp(hb); } });
  }

  // so sánh: bảng nhiệt ngân hàng × năm
  function drawHeat() {
    const cfg = CMP[S.cmp], el = $('chart-cmp');
    const usable = (b, y) => { const r = row(b, y); return r && r.loans != null && r.pat != null ? r : null; };
    const yrs = [...new Set(DATA.map(r => r.year))].sort().filter(y => banks.filter(b => usable(b, y)).length >= banks.length / 2);
    const C = {};
    banks.forEach(b => yrs.forEach(y => { const r = usable(b, y); if (!r) return;
      const s = sim(r, S.bp), v = cfg.get(s); C[b + '|' + y] = { v: ok(v) ? v : null, s, loss: r.pat <= 0, est: S.cmp === 'car' && s.cap && s.cap.est }; }));
    const ly = yrs[yrs.length - 1], key = b => { for (let i = yrs.length - 1; i >= 0; i--) { const c = C[b + '|' + yrs[i]]; if (c && c.v != null) return c.v; } return null; };
    const order = banks.slice().sort((a, b) => { const va = key(a), vb = key(b); if (va == null) return 1; if (vb == null) return -1; return cfg.asc ? va - vb : vb - va; });
    const mag = v => S.cmp === 'pat' ? -v : v, mags = Object.values(C).map(c => c.v).filter(ok).map(mag).sort((a, b) => a - b);
    // màu theo thứ hạng phân vị (không theo giá trị) để vài ô cực đoan không làm nhạt toàn bảng
    const rank = v => { let lo = 0, hi = mags.length; while (lo < hi) { const mid = (lo + hi) >> 1; if (mags[mid] < v) lo = mid + 1; else hi = mid; } return mags.length > 1 ? lo / (mags.length - 1) : 0.5; };
    const short = v => Math.abs(v) >= 10 && S.cmp !== 'max' ? (v < 0 ? '≪ −999%' : '≫') : S.cmp === 'pat' ? sPct(v, Math.abs(v) < 0.1 ? 1 : 0) : S.cmp === 'max' ? f0.format(v) : S.cmp === 'cov' ? f1.format(v) : pct(v, 1);
    $('cmp-title').textContent = cfg.t().replace('?', '') + L(' qua các năm', ' over the years');
    $('cmp-desc').textContent = L(`Mỗi ô là một ngân hàng-năm ở ${f0.format(S.bp)} bp; màu đậm hơn = ${S.cmp === 'pat' ? 'mất nhiều LNST hơn' : 'giá trị cao hơn'} (theo thứ hạng trong toàn bảng)${S.cmp === 'max' ? ' (bp)' : S.cmp === 'cov' ? ' (lần)' : ''}. Xếp theo năm gần nhất có số.${S.cmp === 'car' ? ' Viền đỏ: dưới 8%.' : ''} Ô "lỗ": LNST năm đó ≤ 0.`,
                                  `Each cell is a bank-year at ${f0.format(S.bp)} bp; darker = ${S.cmp === 'pat' ? 'larger profit loss' : 'higher value'} (by rank across the table)${S.cmp === 'max' ? ' (bp)' : S.cmp === 'cov' ? ' (×)' : ''}. Sorted by the latest year with data.${S.cmp === 'car' ? ' Red border: below 8%.' : ''} "loss" cells: PAT ≤ 0 that year.`);
    const w = W(el), lw = 92, th = 24, rh = 24, cw = (w - lw) / yrs.length, h = th + order.length * rh + 4;
    let g = yrs.map((y, j) => `<text class="t-tick" x="${lw + j * cw + cw / 2}" y="15" text-anchor="middle" style="font-weight:${y === ly ? 700 : 400}">${y}</text>`).join('');
    order.forEach((b, i) => {
      const yy = th + i * rh, sel = b === S.bank;
      g += `<g data-bank="${b}" tabindex="0" role="button" aria-label="${b}" style="cursor:pointer">
        <rect x="0" y="${yy}" width="${w}" height="${rh}" rx="6" fill="${sel ? 'var(--accent-soft)' : 'transparent'}"/>
        <text class="${sel ? 't-strong' : 't-lbl'}" x="${lw - 10}" y="${yy + 16}" text-anchor="end">${b}</text>`;
      yrs.forEach((y, j) => {
        const c = C[b + '|' + y], cx = lw + j * cw;
        if (!c || c.v == null) {
          g += `<rect x="${cx + 1.5}" y="${yy + 2}" width="${cw - 3}" height="${rh - 4}" rx="4" fill="var(--card-2)" data-tip="${esc(`<b>${b} ${y}</b><br>${!c ? L('Không có số liệu', 'No data') : c.loss ? L('LNST ≤ 0, không tính được', 'PAT ≤ 0, not computable') : L('Thiếu dữ liệu', 'Missing data')}`)}"/>
            <text x="${cx + cw / 2}" y="${yy + 16}" text-anchor="middle" style="font-size:10px;fill:var(--muted);pointer-events:none">${c && c.loss ? L('lỗ', 'loss') : '–'}</text>`;
          return;
        }
        const t = rank(mag(c.v)), bad = S.cmp === 'car' && c.v < CAR_MIN;
        const tt = `<b>${b} ${y}</b><br>${cfg.t().replace('?', '')}: <b>${cfg.fmt(c.v)}</b>${c.est ? L(' (ước tính)', ' (estimated)') : ''}<br>${L('Người vay tiết kiệm', 'Borrowers save')} ${ty(c.s.save)} ${BN()}<br>${L('LNST', 'PAT')} ${ty(row(b, y).pat)} → ${ty(c.s.pat1)} ${BN()}`;
        g += `<rect x="${cx + 1.5}" y="${yy + 2}" width="${cw - 3}" height="${rh - 4}" rx="4" fill="color-mix(in srgb, var(--accent) ${Math.round(10 + t * 80)}%, var(--card-2))" ${bad ? 'stroke="var(--crit)" stroke-width="2"' : ''} data-tip="${esc(tt)}"/>`;
        if (cw >= 38) g += `<text x="${cx + cw / 2}" y="${yy + 16}" text-anchor="middle" class="num" style="font-size:10.5px;fill:${t > 0.55 ? '#fff' : 'var(--ink)'};pointer-events:none">${short(c.v)}${c.est ? '*' : ''}</text>`;
      });
      g += '</g>';
    });
    el.innerHTML = `<svg viewBox="0 0 ${w} ${h}" role="img" aria-label="${esc(cfg.t())}">${g}</svg>
      <p class="desc" style="margin-top:8px">${L('Bấm vào một ngân hàng để xem chi tiết', 'Click a bank for details')}${S.cmp === 'car' ? L('. * là CAR ước tính', '. * = estimated CAR') : ''}.</p>`;
    bindBanks(el);
  }

  function drawScenYears(ys, R, X) {
    $('scen-title').textContent = L(`${S.bank} qua từng năm ở ${f0.format(S.bp)} bp`, `${S.bank} year by year at ${f0.format(S.bp)} bp`);
    $('scen-desc').textContent = L('Mỗi năm mô phỏng độc lập trên số liệu năm đó. Bấm một dòng để xem riêng năm đó.', 'Each year simulated on its own data. Click a row to view that year.');
    $('tbl-scen').innerHTML = `<thead><tr><th>${L('Năm', 'Year')}</th><th>${L('Dư nợ', 'Loans')}</th><th>${L('Người vay tiết kiệm', 'Borrower savings')}</th><th>${L('LNST nền', 'Base PAT')}</th><th>${L('LNST mới', 'New PAT')}</th><th>Δ</th><th>${L('Giảm tối đa', 'Max cut')}</th><th>${L('Trang trải DP', 'Coverage')}</th><th>CAR</th></tr></thead><tbody>` +
      ys.map((y, i) => ({ y, r: R[i], s: X[i] })).reverse().map(({ y, r, s }) => `<tr data-year="${y}" style="cursor:pointer" class="${y === ys[ys.length - 1] ? 'current' : ''}">
        <td>${y}</td><td>${ty(r.loans)}</td><td>${ty(s.save)}</td><td>${ty(r.pat)}</td><td>${ty(s.pat1)}</td><td>${r.pat > 0 ? sPct(s.patChg) : L('lỗ', 'loss')}</td>
        <td>${ok(s.maxBp) ? f1.format(s.maxBp) + ' bp' : '–'}</td><td>${times(s.cov1)}</td><td>${s.cap ? pct(s.car1, 2) : '–'}</td></tr>`).join('') + '</tbody>';
    $('tbl-scen').querySelectorAll('tr[data-year]').forEach(tr => tr.addEventListener('click', () => { S.year = +tr.dataset.year; render(); }));
  }

  function drawMethodAll(ys, R, X) {
    $('lin-title').textContent = `${L('Số liệu nền', 'Source data')} · ${S.bank} ${ys[0]}–${ys[ys.length - 1]}`;
    $('lin-desc').textContent = `${L('Đơn vị tỷ VND', 'VND bn')}. ${LX(META, 'source')}.`;
    const rows = R.map(lineageRows);
    $('tbl-lineage').innerHTML = `<thead><tr><th>${L('Chỉ tiêu', 'Item')}</th>${ys.map(y => `<th>${y}</th>`).join('')}<th style="text-align:left">${srcHead()}</th></tr></thead><tbody>` +
      rows[0].map(([n, , src, p], k) => `<tr><td>${n}</td>${rows.map(rr => `<td>${cellVal(rr[k][1], p)}</td>`).join('')}<td class="src">${src}</td></tr>`).join('') + '</tbody>';
    const all = R.map((r, i) => flagsFor(r, X[i]).map(f => ({ ...f, y: ys[i] }))).flat(), bad = all.filter(f => !f.good);
    $('flags').innerHTML = `<li>${L(`${all.length - bad.length}/${all.length} phép kiểm tra đạt trên ${ys.length} năm`, `${all.length - bad.length}/${all.length} checks pass across ${ys.length} years`)}</li>` +
      bad.map(f => `<li class="w"><span><b>${f.y}</b> · ${f.t}</span></li>`).join('');
    drawFormulas();
  }

  function renderAll() {
    const ys = yearsOf(S.bank).slice().reverse(), R = ys.map(y => row(S.bank, y)), X = R.map(r => sim(r, S.bp));
    drawHeadAll(ys, R, X);
    if (S.tab === 'sim') {
      drawKpisAll(ys, R, X); drawSensAll(ys, R); drawHeat(); drawScenYears(ys, R, X);
    }
    if (S.tab === 'met') drawMethodAll(ys, R, X);
  }

  // ================== render ==================
  function render() {
    const r = S.year === 'all' ? null : row(S.bank, S.year);
    $('bank').value = S.bank; $('year').value = S.year; $('bp').value = $('bp2').value = S.bp; $('bpRange').value = $('bpRange2').value = Math.min(300, S.bp);
    if (document.activeElement !== $('phi2')) $('phi2').value = Math.round(S.phi * 1000) / 10;
    syncMini();
    ['alpha', 'phi'].forEach(id => { if (document.activeElement !== $(id)) $(id).value = Math.round(S[id] * 1000) / 10; });
    $('bp-pct').textContent = '= ' + f2.format(S.bp / 100) + L(' điểm %', ' pp');
    document.querySelectorAll('#chips .chip, #chips2 .chip').forEach(c => c.setAttribute('aria-pressed', +c.dataset.bp === S.bp));
    document.querySelectorAll('#cmp-seg button').forEach(c => c.setAttribute('aria-pressed', c.dataset.m === S.cmp));
    document.querySelectorAll('#phi-presets button').forEach(c => c.setAttribute('aria-pressed', Math.abs(+c.dataset.phi - S.phi) < 1e-9));
    document.querySelectorAll('.tabs button').forEach(b => b.setAttribute('aria-selected', b.dataset.tab === S.tab));
    ['sim', 'met'].forEach(t => $('tab-' + t).hidden = S.tab !== t);
    drawMacroRow();
    $('matrix-card').hidden = S.year === 'all' || !ECON.scenarios.length;
    if (S.year === 'all') { renderAll(); return; }
    if (!r) return;
    const s = sim(r, S.bp);
    drawHead(r, s);
    if (S.tab === 'sim') {
      $('sens-title').textContent = L('Giảm bao nhiêu thì còn giữ được mục tiêu lợi nhuận?', 'How far can rates be cut before missing the profit target?');
      drawKpis(r, s); drawSens(r, s); drawCmp(); drawScen(r);
      if (ECON.scenarios.length) drawMatrix(r);
    }
    if (S.tab === 'met') drawMethod(r, s);
  }
  function syncYear() {
    const ys = yearsOf(S.bank);
    $('year').innerHTML = `<option value="all">${L('Tất cả', 'All')} (${ys[ys.length - 1]}–${ys[0]})</option>` + ys.map(y => `<option value="${y}">${y}</option>`).join('');
    if (S.year !== 'all' && !ys.includes(S.year)) S.year = ys[0];
  }
  function setBp(v) { S.bp = Math.max(0, Math.min(500, Math.round(+v || 0))); render(); }

  // theme
  const themeBtn = $('theme');
  const sun = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
  const moon = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>';
  function paintTheme() {
    const d = document.documentElement.dataset.theme === 'dark';
    themeBtn.innerHTML = (d ? sun : moon) + (d ? L('Giao diện sáng', 'Light mode') : L('Giao diện tối', 'Dark mode'));
  }
  themeBtn.addEventListener('click', () => {
    const t = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
    document.documentElement.dataset.theme = t; store.set('rcl-theme', t); paintTheme(); render();
  });
  $('lang').addEventListener('click', () => {
    S.lang = S.lang === 'en' ? 'vi' : 'en'; store.set('rcl-lang', S.lang);
    // link chia sẻ mang theo ngôn ngữ: ?lang= khi mở trực tiếp; #en/#vi khi xem trong trang Claude (chỉ hash đi qua được)
    try { const u = new URL(location.href); u.searchParams.delete('lang'); u.hash = S.lang; history.replaceState(null, '', u); } catch (e) {}
    setFmt(); applyStatic(); syncYear(); render(); footer();
  });

  // khởi tạo
  $('bank').innerHTML = banks.map(b => `<option>${b}</option>`).join('');
  $('chips').innerHTML = $('chips2').innerHTML = [0, 10, 25, 50, 100].map(p => `<button class="chip num" data-bp="${p}" aria-pressed="false">${p}</button>`).join('');
  applyStatic(); syncYear();
  $('bank').addEventListener('change', e => { S.bank = e.target.value; syncYear(); render(); });
  $('year').addEventListener('change', e => { S.year = e.target.value === 'all' ? 'all' : +e.target.value; render(); });
  ['bp', 'bpRange', 'bp2', 'bpRange2'].forEach(id => $(id).addEventListener('input', e => setBp(e.target.value)));
  ['chips', 'chips2'].forEach(id => $(id).addEventListener('click', e => { if (e.target.dataset.bp) setBp(e.target.dataset.bp); }));
  $('phi2').addEventListener('input', e => { S.phi = Math.max(0, Math.min(100, +e.target.value || 0)) / 100; render(); });
  // thanh gọn chỉ hiện ở tab Mô phỏng, khi khung điều chỉnh chính đã cuộn khỏi màn hình
  let ctrlVisible = true;
  function syncMini() { $('mini').hidden = ctrlVisible || S.tab !== 'sim'; }
  if ('IntersectionObserver' in window)
    new IntersectionObserver(([e]) => { ctrlVisible = e.isIntersecting; syncMini(); }, { threshold: 0 }).observe($('controls'));
  $('cmp-seg').addEventListener('click', e => { if (e.target.dataset.m) { S.cmp = e.target.dataset.m; render(); } });
  $('phi-presets').addEventListener('click', e => { if (e.target.dataset.phi != null) { S.phi = +e.target.dataset.phi; render(); } });
  ['macro-seg', 'macro-seg2'].forEach(id => $(id).addEventListener('click', e => { if (e.target.dataset.macro) { S.macro = e.target.dataset.macro; render(); } }));
  const pickCell = e => { const td = e.target.closest('td[data-macro]'); if (td) { S.macro = td.dataset.macro; S.bp = +td.dataset.bp; render(); } };
  $('tbl-matrix').addEventListener('click', pickCell);
  $('tbl-matrix').addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); pickCell(e); } });
  document.querySelector('.tabs').addEventListener('click', e => { if (e.target.dataset.tab) { S.tab = e.target.dataset.tab; render(); scrollTo({ top: 0 }); } });
  [['alpha', 100], ['months', 12], ['phi', 100]].forEach(([id, hi]) =>
    $(id).addEventListener('input', e => { const v = Math.max(0, Math.min(hi, +e.target.value || 0)); S[id] = id === 'months' ? v : v / 100; render(); }));
  let rt; addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(render, 120); });
  const footer = () => $('footer').textContent = L(`Nguồn: ${META.source}. Vĩ mô: FiinX (GSO, NHNN). Dữ liệu dựng ${META.built}. Mã nguồn: scripts/build_dataset.py, export_dashboard_data.py, analysis.py, econometrics.py, dashboard/index.html. VietLeap Hackathon 2026.`,
                                                     `Source: ${META.source_en || META.source}. Macro: FiinX (GSO, SBV). Data built ${META.built}. Code: scripts/build_dataset.py, export_dashboard_data.py, analysis.py, econometrics.py, dashboard/index.html. VietLeap Hackathon 2026.`);
  footer();
  render();
})();
</script>
</body>
</html>
